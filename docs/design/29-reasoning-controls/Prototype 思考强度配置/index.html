<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DeepAgent · 思考强度配置原型</title>
  <link rel="icon" href="../../../../console/favicon.svg">
  <link rel="stylesheet" href="../../../../console/themes.css">
  <link rel="stylesheet" href="prototype.css">
  <script src="../../../../console/vendor/lucide.min.js" defer></script>
  <script src="catalog-data.js" defer></script>
  <script src="prototype.js" defer></script>
</head>
<body>
  <header class="prototype-bar">
    <strong>思考强度</strong>
    <nav aria-label="原型界面切换">
      <button data-view="chat" class="active">对话选择</button>
      <button data-view="catalog">模型目录</button>
      <button data-view="models">模型配置</button>
      <button data-view="agent">Agent 配置</button>
      <button data-view="changes">改动汇总</button>
    </nav>
    <span class="prototype-hint">交互原型 · 不写入本地服务</span>
    <button class="icon-btn" id="themeButton" aria-label="切换深浅主题"><i data-lucide="moon"></i></button>
  </header>
  <div class="shell">
    <aside class="rail">
      <div class="brand"><img src="../../../../console/favicon.svg" alt=""><div><strong>DeepAgent</strong><small><b class="status-dot"></b>设计预览</small></div></div>
      <nav>
        <button data-view="chat" data-rail="chat"><i data-lucide="message-square-code"></i>测试</button>
        <button data-view="agent" data-rail="agent"><i data-lucide="bot"></i>Agent</button>
        <button class="muted-action"><i data-lucide="puzzle"></i>集成</button>
        <button class="muted-action"><i data-lucide="rss"></i>渠道</button>
        <small class="nav-group">设置</small>
        <button data-view="models" data-rail="models"><i data-lucide="sparkles"></i>模型</button>
        <button class="muted-action"><i data-lucide="hammer"></i>工具</button>
        <button class="muted-action"><i data-lucide="plug"></i>MCP</button>
        <button class="muted-action"><i data-lucide="book-open-check"></i>Skill</button>
        <small class="nav-group">诊断</small>
        <button class="muted-action"><i data-lucide="messages-square"></i>会话</button>
        <button class="muted-action"><i data-lucide="chart-no-axes-combined"></i>用量</button>
        <button class="muted-action"><i data-lucide="list"></i>日志</button>
      </nav>
      <div class="rail-bottom"><button data-view="catalog" data-rail="catalog"><i data-lucide="settings-2"></i>全局配置</button><button class="muted-action"><i data-lucide="book-open-check"></i>开发调试</button><span><i data-lucide="circle-user-round"></i>本地用户</span></div>
    </aside>
    <main id="mainContent"></main>
  </div>
  <dialog id="catalogAddDialog" aria-labelledby="catalogAddTitle">
    <form id="catalogAddForm">
      <header class="dialog-header"><h2 id="catalogAddTitle">从目录添加模型</h2></header>
      <div class="dialog-body">
        <label class="field"><span>模型</span><select class="btn" id="catalogAddChoice"></select></label>
      </div>
      <footer class="dialog-footer">
        <button type="button" class="btn" id="cancelCatalogAdd">取消</button>
        <button type="submit" class="btn primary" id="confirmCatalogAdd">继续</button>
      </footer>
    </form>
  </dialog>
  <dialog id="modelDialog" class="model-dialog" aria-labelledby="modelDialogTitle">
    <form id="modelForm">
      <header class="dialog-header"><h2 id="modelDialogTitle">编辑模型</h2><button type="button" class="icon-btn" id="closeModelDialog" aria-label="关闭模型配置"><i data-lucide="x"></i></button></header>
      <div class="dialog-body" id="modelDialogBody"></div>
      <footer class="dialog-footer"><span id="modelSaveHint" class="muted">仅保存原型草稿</span><button type="button" class="btn" id="cancelModelDialog">取消</button><button type="submit" class="btn primary">保存</button></footer>
    </form>
  </dialog>
  <div id="menuPortal"></div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
