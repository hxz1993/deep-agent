<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill 详情 · 交互原型</title>
  <link rel="stylesheet" href="console-assets/vendor/github-markdown-light.min.css">
  <link rel="stylesheet" href="console-assets/themes.css">
  <link rel="stylesheet" href="console-assets/workspace.css">
  <link rel="stylesheet" href="console-assets/configuration/configuration.css">
  <link rel="stylesheet" href="console-assets/console.css">
  <link rel="stylesheet" href="console-assets/ui-resource-layout.css">
  <link rel="stylesheet" href="console-assets/ui-primitives.css">
  <style>
    body { display: flex; height: 100dvh; padding: 20px; background: var(--console-surface, var(--bg)); }
    /* The prototype presents the Console detail inside a dialog. */
    #skillDetailPane { width: 100%; }
    #skillDetailPane [data-skill-back] { display: none; }
    #skillDetailPane .skill-detail-header > .skill-preview-close { margin-left: auto; }
    #skillDetailPane .skill-detail-actions { flex-wrap: wrap; }
    /* The Console breakpoint is viewport based. Here the iframe is narrower than the Console. */
    @media (min-width: 650px) {
      #skillDetailPane .skill-detail-layout { grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    }
    @media (max-width: 649px) {
      body { padding: 14px; }
    }
    #previewFeedback { position: fixed; bottom: 12px; right: 20px; color: var(--danger); }
  </style>
  <script src="console-assets/vendor/lucide.min.js"></script>
  <script src="console-assets/vendor/marked.min.js"></script>
  <script src="console-assets/vendor/purify.min.js"></script>
  <script type="module">
    import { parseSkillFrontmatter } from './console-assets/skill-frontmatter.js';
    window.DeepAgentSkillFrontmatter = { parseSkillFrontmatter };
  </script>
  <script src="console-assets/markdown.js"></script>
  <script src="console-assets/configuration/skills.js"></script>
</head>
<body id="configurationHost" data-console-page="configuration">
  <section id="skillDetailPane" class="skill-detail-pane agent-editor-page hidden"></section>
  <div id="previewFeedback" role="status"></div>
  <script>
    // Only mock transport and shell. Rendering, resource selection and download use skillsAdmin.
    let fixture;
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const formatDate = value => value ? new Date(value).toLocaleString('zh-CN', {timeZone:'Asia/Shanghai', hour12:false}) : '—';
    const showToast = message => { document.getElementById('previewFeedback').textContent = message; };
    const serviceUrl = path => path;
    const apiFetch = async (path, {signal} = {}) => {
      if (signal?.aborted) throw signal.reason;
      if (!fixture) throw new Error('缺少 Skill 原型数据。');
      const base = '/api/v1/skills/' + encodeURIComponent(fixture.detail.code);
      if (path === base) return fixture.detail;
      if (path.startsWith(base + '/resources/')) {
        const resourcePath = path.slice((base + '/resources/').length).split('?')[0].split('/').map(decodeURIComponent).join('/');
        const resource = fixture.files.find(file => file.path === resourcePath);
        if (resource) return {content:resource.text, format:resource.path.split('.').pop(), returned_count:resource.text.split('\n').length};
      }
      throw new Error('未找到 Skill 资源。');
    };
    const daFetch = async path => {
      if (!fixture || path !== '/api/v1/skills/' + encodeURIComponent(fixture.detail.code) + '/package') return new Response(null, {status:404});
      return new Response(fixture.zip, {headers:{
        'Content-Type':'application/zip',
        'Content-Disposition':`attachment; filename*=UTF-8''${encodeURIComponent(fixture.detail.code + '-prototype.zip')}`,
      }});
    };
    const handleSkillAction = skillsAdmin.handleAction.bind(skillsAdmin);
    skillsAdmin.handleAction = (action, skill) => action === 'download'
      ? handleSkillAction(action, skill)
      : window.parent.handlePrototypeSkillAction?.(action, skill.code);
    window.openPrototypeSkill = async data => {
      document.getElementById('previewFeedback').textContent = '';
      fixture = data;
      skillsAdmin.deactivate();
      await skillsAdmin.select(data.detail.code);
      if (fixture !== data) return;
      const header = document.querySelector('#skillDetailPane .skill-detail-header');
      if (!header) return;
      const close = document.createElement('button');
      close.type = 'button';
      close.className = 'skill-more-trigger skill-preview-close';
      close.setAttribute('aria-label', '关闭预览');
      close.title = '关闭预览';
      close.innerHTML = '<i data-lucide="x"></i>';
      close.onclick = () => window.parent.closeSkillPreview?.();
      (header.querySelector('.skill-detail-actions') || header).append(close);
      window.lucide?.createIcons();
    };
    window.closePrototypeSkill = () => { skillsAdmin.deactivate(); fixture = null; };
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || event.defaultPrevented) return;
      if (!document.querySelector('[data-skill-more-menu]:not([hidden])')) window.parent.closeSkillPreview?.();
    });
  </script>
</body>
</html>
