<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepAgent 用量页 · 三版图片原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0f5;color:#222839;font:14px system-ui,sans-serif}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #dde1e9;padding:16px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:17px;margin:0}nav{display:flex;gap:8px}button{border:1px solid #dce0e8;background:#fff;padding:8px 14px;border-radius:7px;cursor:pointer;color:inherit}button[aria-pressed=true]{background:#eee9ff;color:#633ee8;border-color:#cfc0ff}small{color:#6b7280}main{max-width:1700px;margin:20px auto;padding:0 20px}p{color:#677084}img{display:block;width:100%;height:auto;background:#fff;border:1px solid #dde1e9;border-radius:8px}a{color:#633ee8}
</style>
<header><h1>DeepAgent 用量页</h1><nav aria-label="原型方案"><button data-index="0" aria-pressed="true">A · 清爽总览</button><button data-index="1" aria-pressed="false">B · 人员工作台</button><button data-index="2" aria-pressed="false">C · 趋势分析</button></nav><small>图片原型 · 示例数据 · 尚未实现</small></header>
<main><p id="description"></p><a id="original" target="_blank" rel="noopener"><img id="prototype" alt=""></a></main>
<script>
const variants=[
{file:'01-清爽总览.png',description:'A · 推荐：白底紫色、完整总览。汇总、趋势和人员明细依次排列。'},
{file:'02-人员工作台.png',description:'B · 按人查看：左侧固定人员列表，右侧展示选中用户的趋势和模型明细。管理员标识正式实现时放在页面级。'},
{file:'03-趋势分析.png',description:'C · 分析优先：紫色与青色区分数据，趋势、排名、模型明细集中展示。'}
];
function select(i){const v=variants[i];document.querySelector('#description').textContent=v.description;document.querySelector('#prototype').src=v.file;document.querySelector('#prototype').alt=v.description;document.querySelector('#original').href=v.file;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.index)===i)));}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>select(Number(b.dataset.index))));select(0);
</script>
</html>
