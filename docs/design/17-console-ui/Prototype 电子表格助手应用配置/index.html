<style>
:root{--accent:#5141e5;--accent-text:#4936cf;--accent-soft:#efedff;--text:#202630;--muted:#596473;--subtle:#657181;--line:#dbe2e9;--line-soft:#e9edf2;--panel:#f4f6f9;--rail:#f4f6f8;--surface:#fff;--green:#18734a;--green-bg:#eaf7ef;--error:#ac2737;--error-bg:#fff0f2;--radius:8px;--rail-width:190px;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--text);font:13px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.48}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:none}
[hidden]{display:none!important}.icon{width:16px;height:16px;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.shell{display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);height:100dvh;min-height:0}.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:13px 10px 10px}
.brand{display:flex;gap:10px;align-items:center;padding:0 5px 13px}.brand img{width:34px;height:40px}.brand strong{display:block;font-size:15px}.presence{color:var(--subtle);font-size:11px}.presence::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#2f9f71;margin-right:5px}
.nav{display:grid;gap:3px}.nav-item{border:0;background:none;text-align:left;display:flex;align-items:center;gap:10px;width:100%;border-radius:8px;padding:8px 10px;color:#344154;text-decoration:none;font-weight:500}
button.nav-item:not(:disabled):hover,.nav-item.selected{background:#e7e4fb;color:var(--accent-text)}.nav-item.static{color:#566172}
.nav-group{padding:15px 10px 4px;color:var(--subtle);font-size:11px}.rail-end{margin-top:auto;display:grid;gap:4px}
.identity{border-top:1px solid var(--line);padding:12px 8px 0;color:var(--muted);display:flex;align-items:center;gap:8px}
main{min-width:0;overflow:auto;position:relative}.page{padding:22px 24px 36px}.page-body{max-width:1120px}.page-head,.bar,.section-head,.detail-head,.subbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.page-head{margin-bottom:24px;align-items:flex-start}.detail-head{align-items:flex-start}.detail-head .actions{padding-top:2px}
h1,h2,h3,p{margin:0}h1{font-size:16px;line-height:24px}h2{font-size:14px;line-height:23px}h3{font-size:13px}
.subtitle,.muted{color:var(--muted)}.subtitle{margin-top:5px;font-size:12px}.meta{font-size:11px;color:var(--subtle)}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:500;color:var(--accent-text);background:var(--accent-soft);white-space:nowrap}
.tag.ok{color:var(--green);background:var(--green-bg)}.tag.neutral{background:var(--panel);color:var(--muted)}.tag.error{background:var(--error-bg);color:var(--error)}
.prototype{background:var(--panel);color:var(--subtle);border:1px solid var(--line-soft)}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);min-height:32px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:4px 10px;white-space:nowrap;font-weight:500}
.btn:not(:disabled):hover{background:#f5f6fa;border-color:#c6cdd7}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.primary:not(:disabled):hover{background:#4434d3;border-color:#4434d3}
.btn.text{border-color:transparent;background:transparent;color:var(--accent-text)}.btn.danger{color:var(--error)}.btn.icon-only{min-width:32px;padding:0}
.table-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto}.table{width:100%;border-collapse:collapse;text-align:left}.table th{font-size:12px;font-weight:500;color:#505e70;background:#f3f5f8;white-space:nowrap}
.table td,.table th{padding:9px 12px;border-bottom:1px solid var(--line-soft)}.table td{height:52px}.table tbody tr:last-child td{border-bottom:0}.table td:last-child,.table th:last-child{text-align:right}
.table td:last-child .actions{justify-content:flex-end}.table tr:hover td{background:#fafbfc}.entity{display:flex;gap:10px;align-items:center;min-width:0}.entity-icon{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:7px;background:var(--accent-soft);color:var(--accent-text)}
.entity strong{display:block;font-weight:600}.breadcrumb{display:flex;align-items:center;gap:7px;color:var(--subtle);margin:-4px 0 14px}.breadcrumb .btn{padding-left:0;min-height:26px}
.select,.input,.textarea{border:1px solid #d2dae4;border-radius:var(--radius);background:white;min-height:32px;padding:5px 10px;min-width:0}.select{max-width:100%;padding-right:20px}
.tabs{display:flex;gap:21px;border-bottom:1px solid var(--line);margin-bottom:17px}.tab{border:0;border-bottom:2px solid transparent;padding:9px 1px 7px;background:none;color:var(--muted);font-weight:500}.tab.active{color:var(--accent-text);border-bottom-color:var(--accent)}
.subbar{margin:0 0 10px}.subbar .actions{flex:1;min-width:0}.search{display:flex;align-items:center;gap:7px;border:1px solid #d2dae4;border-radius:var(--radius);height:32px;padding:0 8px;color:var(--subtle);width:min(245px,100%)}.search input{border:none;background:none;width:100%;min-width:0}
.empty{text-align:center!important;color:var(--muted);padding:28px 12px!important}
.detail-section{margin-top:24px}.detail-section+.detail-section{border-top:1px solid var(--line-soft);padding-top:19px}.section-head{align-items:flex-start;margin-bottom:9px}
.textarea{width:100%;min-height:132px;resize:vertical;font-size:13px;line-height:1.75;padding:9px 12px}.counter{text-align:right;color:var(--subtle);font-size:11px;margin-top:3px}
.scope-line{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}.scope-line .icon{width:14px;height:14px}.scope-line>span{display:flex;gap:5px;align-items:center}
pre{padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:8px;white-space:pre-wrap;font-size:12px;overflow-wrap:anywhere}
dialog{padding:0;border:1px solid var(--line);border-radius:12px;width:min(490px,calc(100% - 28px));color:var(--text);box-shadow:0 20px 48px #14223a30;max-height:calc(100dvh - 40px)}
dialog.wide{width:min(635px,calc(100% - 28px))}dialog::backdrop{background:#20283848}.dialog-head,.dialog-body,.dialog-foot{padding:14px 17px}.dialog-head,.dialog-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}.dialog-head{border-bottom:1px solid var(--line)}.dialog-foot{justify-content:flex-end;border-top:1px solid var(--line)}.dialog-head .btn{border-color:transparent}.dialog-body>p{margin-bottom:10px}
.inline-form{display:flex;gap:7px;margin:6px 0 9px}.inline-form .input{flex:1}.feedback{margin:8px 0 0;padding:8px 9px;border-radius:7px;background:var(--panel);font-size:12px;color:var(--muted)}.feedback.ok{background:var(--green-bg);color:var(--green)}.feedback.error{background:var(--error-bg);color:var(--error)}
.drop{display:flex;align-items:center;gap:10px;width:100%;border:1px dashed #bfc9d8;border-radius:8px;background:white;text-align:left;padding:13px 12px}.drop .icon{color:var(--accent);width:22px;height:22px}.drop.drag,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.file-list{padding:0;margin:8px 0 0;list-style:none;display:grid;gap:5px}.file-list li,.library-row{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line-soft);padding:6px 8px;border-radius:6px;overflow-wrap:anywhere}
.library-row{justify-content:flex-start;cursor:pointer}.library-row+.library-row{margin-top:6px}.library-row input{accent-color:var(--accent)}
.toast{position:fixed;z-index:8;bottom:22px;left:calc(50% + var(--rail-width)/2);transform:translateX(-50%);background:#2e3547;color:white;border-radius:7px;padding:8px 13px;box-shadow:0 3px 12px #24283f30;max-width:calc(100% - 24px)}
.test{height:100%;display:grid;grid-template-columns:232px minmax(0,1fr);min-height:570px}.sessions{padding:11px 10px;border-right:1px solid var(--line);min-width:0}.sessions .select,.sessions .search{width:100%;margin-bottom:8px}.session-item{padding:8px 9px;border-radius:7px}.session-item.current{background:var(--accent-soft);color:var(--accent-text)}.session-item+.session-item{margin-top:3px}
.conversation{position:relative;min-width:0;display:grid;grid-template-rows:48px minmax(0,1fr)}.chat-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line)}
.btn.popover-trigger{background:var(--panel);border-color:transparent}.btn.popover-trigger:hover{border-color:var(--line)}
.chat-content{display:grid;place-items:center;padding:20px}.welcome{text-align:center;width:min(530px,100%);min-width:0}.welcome img{width:34px;height:39px}.welcome h1{font-size:21px;margin:6px 0}.welcome p{color:var(--muted);font-size:12px;margin:0 0 13px}
.composer{width:100%;text-align:left;border:1px solid #cdd6e1;border-radius:12px;box-shadow:0 2px 7px #1a285b0d;padding:7px 9px}.composer textarea{display:block;width:100%;border:0;resize:vertical;min-height:52px;padding:5px 4px}.composer .actions{justify-content:flex-end}
.popover{position:absolute;z-index:5;top:43px;right:12px;width:min(350px,calc(100% - 20px));border:1px solid var(--line);background:white;box-shadow:0 10px 35px #1a254527;border-radius:11px;padding:12px}.popover header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}.popover header .btn{border-color:transparent;min-height:26px;min-width:26px}
.popover footer{display:flex;justify-content:flex-end;gap:7px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.popover .context-summary{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;padding-top:8px}.context-summary dt,.context-summary dd{margin:0}.context-summary dd{text-align:right;color:var(--muted);overflow-wrap:anywhere}.popover .inline-form{margin-bottom:5px}
.options{max-height:182px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px;margin:5px 0 8px}.options-label{font-size:11px;padding:3px 7px;color:var(--subtle)}.option{border:0;background:white;display:flex;align-items:center;gap:8px;justify-content:space-between;width:100%;text-align:left;padding:5px 7px;border-radius:5px}.option:hover,.option:focus-visible{background:var(--accent-soft)}.option .meta{display:block}
.debug-result{margin-top:9px;text-align:left}.ghost-link{background:none;border:0;padding:0;color:var(--accent-text);text-decoration:none}
@media(max-width:900px){:root{--rail-width:155px}.page{padding:17px 17px 28px}.table td,.table th{padding:7px 9px}.test{grid-template-columns:175px 1fr}.chat-head{padding:0 8px}}

.integration-item strong,.integration-item .meta{display:block}.integration-item strong{font-weight:600}.integration-item .icon:last-child{margin-left:auto;width:14px}

.integration-agent-menu.popover{inset:calc(100% + 5px) auto auto 0;width:100%}

.app-workspace .section-head :is(label,h2){font-size:13px;font-weight:400}
.prompt-help{position:relative;display:inline-flex}.prompt-help button{border:0;background:transparent;color:var(--subtle);padding:3px}
.prompt-help .icon{width:14px;height:14px}

.prompt-help:hover [role=tooltip],.prompt-help:focus-within [role=tooltip]{display:block}
.app-prompt .textarea{flex:1;min-height:260px;resize:none}
.app-prompt .prompt-estimate{color:var(--subtle);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.app-skills{border-left:1px solid var(--line);padding-left:20px;min-width:0}.app-workspace .section-head{align-items:center;min-height:32px;margin-bottom:8px}
.skill-table{min-width:550px}.skill-table td,.skill-table th{padding-inline:8px}
.skill-table :is(th,td):last-child{width:35px;color:var(--subtle)}
.skill-row,.app-row{cursor:pointer}
.table-name-button{display:flex;align-items:center;border:0;background:transparent;padding:0;text-align:left;max-width:100%;color:inherit}
.table-name-button:hover strong{color:var(--accent-text)}
.resource-count{display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.resource-count span,.app-skill-count{display:inline-flex;align-items:center;gap:4px}
.resource-count .icon,.app-skill-count .icon{width:13px;height:13px;color:var(--subtle)}
.app-test-cell{width:1%;white-space:nowrap}
.app-test-cell .btn{min-height:28px}
.skill-updated{white-space:nowrap;color:var(--subtle);font-size:12px}
.btn.danger-solid{color:white;background:#a72e3c;border-color:#a72e3c}.btn.danger-solid:hover{color:var(--error)}
dialog.skill-preview{width:min(1130px,calc(100% - 32px));height:min(730px,calc(100dvh - 48px));max-height:none;overflow:hidden}
.skill-preview-frame{display:block;width:100%;height:100%;border:0}
.debug-combo{position:relative;margin:6px 0 5px}.debug-combo-field{display:flex;align-items:stretch;border:1px solid #d2dae4;border-radius:var(--radius);background:var(--surface);min-height:33px}

.debug-combo-field .btn[aria-expanded="true"] .icon{transform:rotate(180deg)}.debug-combo .options{position:absolute;z-index:1;inset:100% 0 auto;margin:4px 0 0;max-height:210px;background:var(--surface);box-shadow:0 8px 20px #1a254522}
.option.active{background:var(--accent-soft);color:var(--accent-text)}
@media(max-width:1120px){.app-workspace{grid-template-columns:1fr;align-content:start}.app-prompt .textarea{min-height:225px;resize:vertical}.app-skills{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}.app-workspace .section-head{min-height:0}}
@media(max-width:850px){.integration-split{grid-template-columns:165px minmax(0,1fr)}.integration-list{padding-right:9px}.integration-config{padding-left:12px}}
@media(max-width:670px){.integration-split{grid-template-columns:1fr;min-height:0}.integration-list{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:0 0 9px;margin-bottom:12px}.integration-list .nav-group{display:none}.integration-config{padding-left:0}.integration-item strong{font-size:12px}.integration-item .meta,.integration-item .icon:last-child{display:none}.app-toolbar{justify-content:flex-start}.skill-table .skill-updated{display:none}.skill-table{min-width:360px}}

function stepDebugOption(delta){
 const box=E('debugOptions');
 if(box.hidden)openOptions(true,true);
 const rows=[...box.querySelectorAll('[role=option]')];
 if(!rows.length)return;
 debugOption=debugOption<0?(delta>0?0:rows.length-1):(debugOption+delta+rows.length)%rows.length;
 rows.forEach((row,index)=>row.classList.toggle('active',index===debugOption));

 E('debugCode').setAttribute('aria-activedescendant',selected.id);
 selected.scrollIntoView({block:'nearest'});
}

function stageFiles(files){
 uploadFiles=Array.from(files).map(file=>({file,valid:/\.zip$/i.test(file.name)&&file.size<=10485760&&file.size>0}));
 if(uploadTarget&&uploadFiles.length!==1)uploadFiles.forEach(f=>f.valid=false);
 E('zipList').innerHTML=uploadFiles.map(({file,valid})=>'<li><span>'+esc(file.name)+'</span><span class="tag '+(valid?'neutral':'error')+'">'+(valid?'待安装':'请选择有效 ZIP')+'</span></li>').join('');
 E('skillDialogConfirm').disabled=!uploadFiles.some(item=>item.valid);
}
function finishSkill(){
 const accepted=uploadFiles.filter(x=>x.valid);
 if(!accepted.length)return;
 const target=skillMode==='generic'?generic:draft.skills;
 for(const {file} of accepted){
  const name=file.name.replace(/\.zip$/i,'');
  const code=uploadTarget||name.toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'')||'demo-skill-'+(target.length+1);
  const index=target.findIndex(s=>s.code===code);
  const item={code,name:target[index]?.name||name,version:'示例',description:'已模拟上传 '+file.name+'。原型未读取 ZIP 内部文件。',updatedAt:new Date().toISOString()};
  if(index<0)target.push(item);else target[index]=item;
 }
 E('skillDialog').close();render();
 notify(skillMode==='generic'?'已模拟上传。':'已模拟上传，保存应用配置后生效。');
}
function skillFiles(skill){

function promptEstimate(value){

}

 if(!item)return;
 pendingRemove={kind,code};
 E('removeTitle').textContent=isApp?'移除应用配置':page==='skills'?'删除 Skill':'删除专用 Skill';
 E('removeConfirm').textContent=isApp?'确认移除':'确认删除';
 E('removeCopy').textContent=isApp?'将移除「'+item.name+'」的追加提示词和全部专用 Skill。其他应用不受影响。':'将删除「'+item.name+'」。'+(page==='skills'?'':'保存应用配置后生效。');
 E('removeDialog').showModal();
}
function makeSampleZip(files){
 const enc=new TextEncoder(),entries=files.map(f=>({name:enc.encode(f.path),content:enc.encode(f.text)}));
 const start=entries.reduce((n,e)=>n+30+e.name.length+e.content.length,0),size=entries.reduce((n,e)=>n+46+e.name.length,0),z=new Uint8Array(start+size+22),v=new DataView(z.buffer);
 const w=(p,n)=>v.setUint16(p,n,true),d=(p,n)=>v.setUint32(p,n,true);
 let local=0,dir=start;
 for(const {name,content} of entries){
  let crc=0xffffffff;for(const b of content){crc^=b;for(let k=0;k<8;k++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);}crc=(crc^0xffffffff)>>>0;
  d(local,0x04034b50);w(local+4,20);d(local+14,crc);d(local+18,content.length);d(local+22,content.length);w(local+26,name.length);z.set(name,local+30);z.set(content,local+30+name.length);
  d(dir,0x02014b50);w(dir+4,20);w(dir+6,20);d(dir+16,crc);d(dir+20,content.length);d(dir+24,content.length);w(dir+28,name.length);d(dir+42,local);z.set(name,dir+46);
  local+=30+name.length+content.length;dir+=46+name.length;
 }
 d(dir,0x06054b50);w(dir+8,entries.length);w(dir+10,entries.length);d(dir+12,size);d(dir+16,start);
 return new Blob([z],{type:'application/zip'});
}
document.addEventListener('input',e=>{
 const id=e.target.id;
 if(id==='appSearch'){filter=e.target.value;E('appTable').innerHTML=appTable();}
 if(id==='appPrompt'){draft.prompt=e.target.value;E('promptCount').textContent=promptEstimate(draft.prompt);}
 if(id==='newCode'){verified=null;E('continueBtn').disabled=true;E('appFeedback').hidden=true;}
 if(id==='debugCode'){debugDraft=e.target.value;E('debugFeedback').hidden=true;E('debugSummary').innerHTML=debugSummary(debugApp);openOptions(true);}
 if(id==='question')testQuestion=e.target.value;
 if(id==='generalSearch'){const q=e.target.value.toLowerCase();E('generalTable').innerHTML=skillTable(generic.filter(s=>(s.name+s.code).toLowerCase().includes(q)),false);}
});
document.addEventListener('change',e=>{
 if(e.target.id==='tenantFilter'){tenant=e.target.value;E('appTable').innerHTML=appTable();}
 if(e.target.id==='testAgent'){debugAgent=e.target.value;renderTest();}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&integrationAgentDraft!==null){
  integrationAgentDraft=null;
  refreshIntegrationAgentEditor('#integrationAgentTrigger');
 }
 if(e.key==='Escape'&&E('debugPopover')&&!E('debugPopover').hidden){
  if(!E('debugOptions').hidden){openOptions(false);E('debugCode').focus();}
  else{closeDebug();E('debugTrigger').focus();}
 }
 if(e.target.id==='debugCode'&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();stepDebugOption(e.key==='ArrowDown'?1:-1);}
 if(e.target.id==='debugCode'&&e.key==='Enter'){
  e.preventDefault();
  if(debugOption>=0)E('debugOption'+debugOption)?.click();
  else document.querySelector('[data-action=apply-debug]')?.click();
 }
 if(e.target.id==='newCode'&&e.key==='Enter'&&!verified){e.preventDefault();verifyApp();}
});
document.addEventListener('click',e=>{
 if(integrationAgentDraft!==null&&!e.target.closest('#integrationAgentRow')){
  integrationAgentDraft=null;
  refreshIntegrationAgentEditor();
 }
 const pop=E('debugPopover');
 if(pop&&!pop.hidden){
  if(pop.contains(e.target)&&!e.target.closest('.debug-combo'))openOptions(false);
  else if(!pop.contains(e.target)&&!e.target.closest('[data-action=open-debug]'))closeDebug();
 }
 const close=e.target.closest('[data-close]');if(close){E(close.dataset.close).close();return;}
 const fill=e.target.closest('[data-fill]');if(fill){E('newCode').value=fill.dataset.fill;verified=null;E('continueBtn').disabled=true;E('appFeedback').hidden=true;E('newCode').focus();return;}
 const b=e.target.closest('[data-action]');
 if(!b){
  if(e.target.id==='debugCode'&&E('debugOptions').hidden)openOptions(true,true);
  e.target.closest('[data-app-row], [data-skill-row]')?.querySelector('.table-name-button').click();
  return;
 }
 const action=b.dataset.action,code=b.dataset.code;
 if(action.startsWith('nav-')){go(action.slice(4));return;}
 if(action==='edit-app'){go('app',code);return;}
 if(action==='add-app'){verified=null;E('newCode').value='';E('continueBtn').disabled=true;E('appFeedback').hidden=true;E('appDialog').showModal();}
 if(action==='integration-agent-toggle'){
  integrationAgentDraft=integrationAgentDraft===null?(page==='cube'?cubeAgent:agent):null;
  refreshIntegrationAgentEditor('#integrationAgentTrigger');
  return;
 }
 if(action==='integration-agent-cancel'){
  integrationAgentDraft=null;
  refreshIntegrationAgentEditor('#integrationAgentTrigger');
  return;
 }
 if(action==='integration-agent-pick'){
  integrationAgentDraft=code;
  refreshIntegrationAgentEditor('#integrationAgentMenu .option[aria-pressed="true"]');
  return;
 }
 if(action==='integration-agent-clear'){
  integrationAgentDraft='';
  refreshIntegrationAgentEditor('#saveIntegrationAgent');
  return;
 }
 if(action==='integration-agent-save'){
  if(page==='cube')cubeAgent=integrationAgentDraft;
  else agent=integrationAgentDraft;
  integrationAgentDraft=null;
  refreshIntegrationAgentEditor('#integrationAgentTrigger');
  notify('Agent 配置已保存（原型）');
  return;
 }
 if(action==='save-app'){
  if(!draft.prompt.trim()&&!draft.skills.length){notify('请填写追加系统提示词，或上传至少一个专用 Skill。');return;}
  profiles[current]=structuredClone(draft);render();notify('应用配置已保存（原型）');
 }
 if(action==='test-app'){
  if(!profiles[code])return;
  if(!agent){notify('请先为电子表格助手配置 Agent。');return;}
  debugAgent=agent;
  go('test');
  showDebug(code);
  return;
 }
 if(action==='remove-app')confirmRemoval('app',current);
 if(action.startsWith('skill-')){
  const mode=action.slice(6);
  const skill=code?findSkill(code):null;
  if(mode==='preview'&&skill)void showSkillPreview(skill);
  if(mode==='upload'||mode==='generic')showSkillUpload(mode,code);
  return;
 }
 if(action==='open-debug')showDebug();
 if(action==='close-debug'){closeDebug();E('debugTrigger').focus();}
 if(action==='toggle-options'){openOptions(E('debugOptions').hidden,true);E('debugCode').focus();}
 if(action==='pick-debug'){debugDraft=code;E('debugCode').value=code;E('debugFeedback').hidden=true;E('debugSummary').innerHTML=debugSummary(code,code!==debugApp);openOptions(false);E('debugCode').focus();}
 if(action==='reset-debug'){debugApp='';renderTest();notify('调试上下文已重置');}
 if(action==='apply-debug'){
  const code=E('debugCode').value.trim();
  if(code&&!apps[code]){const f=E('debugFeedback');f.hidden=false;f.className='feedback error';f.textContent='应用不存在，或不属于当前账号可管理的企业。';openOptions(false);return;}
  debugApp=code;renderTest();notify('调试 App 已应用到新对话');
 }
 if(action==='mock-send'){
  if(!E('question').value.trim()){E('question').focus();return;}
  const p=profiles[debugApp],run=E('runPreview');run.hidden=false;
  run.textContent=p&&debugAgent===agent?'模拟装配：基础提示词 + 应用追加提示词；可用专用 Skill '+p.skills.length+' 个。':'模拟装配：仅使用当前 Agent 的通用配置。';
 }
});
E('verifyBtn').onclick=verifyApp;
E('appForm').onsubmit=e=>{e.preventDefault();if(!verified)return;E('appDialog').close();go('app',verified);};
E('skillDialogConfirm').onclick=finishSkill;
E('editSkillForm').onsubmit=e=>{
 e.preventDefault();
 const skill=findSkill(editingSkillCode),name=E('editSkillName').value.trim();
 if(!skill||!name)return;
 skill.name=name;
 skill.description=E('editSkillDescription').value.trim();
 skill.updatedAt=new Date().toISOString();
 E('editSkillDialog').close();
 render();
 void showSkillPreview(skill);
};
E('removeConfirm').onclick=()=>{
 if(!pendingRemove)return;
 const {kind,code}=pendingRemove;pendingRemove=null;E('removeDialog').close();
 if(kind==='skill'){
  const items=currentSkills(),index=items.findIndex(s=>s.code===code);
  if(index<0)return;
  items.splice(index,1);
  window.closeSkillPreview();
  render();
  notify(page==='skills'?'已删除 Skill（原型）。':'已从此应用删除，保存后生效。');
  return;
 }
 delete profiles[code];draft={prompt:'',skills:[]};go('apps');notify('已移除应用配置及其专用 Skill。');
};
document.querySelectorAll('[data-icon]').forEach(el=>{el.outerHTML=icon(el.dataset.icon);});
function readHash(){
 const path=location.hash.slice(1).replace(/^\//,'');const [next,code]=path.split('/');
 integrationAgentDraft=null;
 if(next==='app'&&apps[code]){page=next;current=code;draft=structuredClone(profiles[code]||{prompt:'',skills:[]});}
 else if(['apps','integrations','api','test','skills','cube'].includes(next)){page=next;if(page==='test'&&!debugAgent)debugAgent=agent||agentNames[0];}
 render();
}
window.addEventListener('popstate',readHash);
readHash();
</script>
</body>
