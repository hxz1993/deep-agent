<!doctype html>
<html lang="zh-CN">
<body>
  <main class="settings-card models-card">
    <div class="models-toolbar">
      <div>
        <h1 class="catalog-title">
          模型目录
          <span class="catalog-info" tabindex="0" aria-label="查看模型目录说明">
            <i data-lucide="info"></i>
            <span class="catalog-info-tooltip" role="tooltip">
              <strong>目录与运行配置的关系</strong>
              <span>仅展示 DeepAgent 已支持且位于代码白名单中的接入渠道。</span>
              <span>更新失败时保留旧目录，不会修改已有模型配置。</span>
              <span>“使用此模型”只预填目录属性；私有模型仍可手工创建。</span>
            </span>
          </span>
        </h1>
        <p class="settings-desc models-desc">
          目录由管理员从 <strong>models.dev</strong> 手工更新。目录只用于预填模型配置，
          Agent 运行时始终读取“模型配置列表”中已保存的属性。
        </p>
      </div>
      <div class="models-toolbar-actions">
        <button type="button" class="btn catalog-icon-action" id="catalogReloadBtn" title="重新加载" aria-label="重新加载"><i data-lucide="refresh-cw"></i></button>
        <button type="button" class="btn primary" id="catalogRefreshBtn"><i data-lucide="cloud-download"></i>更新模型目录</button>
      </div>

      <div class="models-filters">
        <label class="field models-search-field">
          <span>搜索</span>
          <input type="search" id="catalogSearchInput" placeholder="模型、Lab 或接入渠道" autocomplete="off" />
        </label>
        <label class="field models-filter-field">
          <span>接入渠道</span>
          <select id="catalogProviderSelect">
            <option value="">全部</option>
          </select>
        </label>
        <label class="field models-filter-field">
          <span>输入模态</span>
          <select id="catalogModalitySelect">
            <option value="">全部</option>
            <option value="text">文本</option>
            <option value="image">图像</option>
            <option value="audio">音频</option>
            <option value="video">视频</option>
          </select>
        </label>
        <div class="field catalog-view-control">
          <span>查看方式</span>
          <div class="catalog-view-tabs" role="tablist" aria-label="模型目录查看方式">
            <button type="button" class="catalog-view-tab active" data-catalog-view="model"><i data-lucide="rows-3"></i><span>模型</span></button>
            <button type="button" class="catalog-view-tab" data-catalog-view="provider"><i data-lucide="waypoints"></i><span>渠道</span></button>
          </div>
        </div>
      </div>
    </div>

    <div class="catalog-feedback hidden" id="catalogFeedback" role="alert"></div>
    <p class="models-status" id="catalogStatusLine">加载中…</p>

    <div class="catalog-browser" id="catalogBrowser">
      <aside class="catalog-lab-sidebar" id="catalogLabSidebar" aria-label="模型研发方">
        <div class="catalog-lab-heading"><span>模型研发方</span><i data-lucide="flask-conical"></i></div>
        <button type="button" class="catalog-lab-item active" data-lab-id="">
          <span>全部 Lab</span><strong>0</strong>
        </button>
      </aside>

      <section class="catalog-results">
        <div class="table-wrap models-table-wrap">
          <table class="data-table catalog-model-table" id="catalogModelsTable">
            <thead id="catalogTableHead"></thead>
            <tbody id="catalogTableBody">
              <tr><td colspan="6" class="empty-cell">加载中…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="catalog-empty hidden" id="catalogEmptyState">
          <strong>模型目录尚未更新</strong>
          <span>点击“更新模型目录”，联网获取并完整校验 models.dev 目录后写入数据库。</span>
          <button type="button" class="btn primary" data-catalog-refresh>更新模型目录</button>
        </div>
      </section>
    </div>

    <div class="models-pagination" id="catalogPaginationBar">
      <button type="button" class="btn btn-sm" id="catalogPrevPageBtn" disabled>上一页</button>
      <span class="models-page-info" id="catalogPageInfo">—</span>
      <button type="button" class="btn btn-sm" id="catalogNextPageBtn" disabled>下一页</button>
    </div>

  </main>
</body>
</html>
