<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>渠道应用鉴权 · 三种布局原型</title>
<style>
:root{--accent:#5145ed;--text:#252a31;--muted:#77808c;--line:#d7dfe8;--soft:#f5f7f9;--tint:#f0edff}*{box-sizing:border-box}body{margin:0;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--text);background:#e5e7eb}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8b83ff;outline-offset:2px}button{color:inherit}.review{background:white;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line)}.review strong{font-size:15px}.review p{margin:4px 0 0;color:var(--muted);font-size:12px}.schemes{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:8px}.schemes button{padding:8px 14px;border:0;border-radius:5px;background:transparent;white-space:nowrap;color:var(--muted)}.schemes button[aria-pressed=true]{background:white;color:var(--accent);box-shadow:0 1px 4px #0001}.stage{min-height:calc(100vh - 91px);padding:28px 16px 90px;display:flex;justify-content:center;align-items:center;background:#24292f26}.modal{width:800px;max-width:100%;background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 70px #29324122;overflow:hidden}.head{height:62px;padding:0 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}h1{font-size:16px;margin:0}.head small{color:var(--muted);font-size:12px}.badge{font-size:11px;background:var(--tint);color:var(--accent);padding:2px 6px;border-radius:3px}.close{margin-left:auto;font-size:21px;border:0;background:transparent;color:var(--muted)}.body{padding:20px 24px 0}.base{display:grid;grid-template-columns:1fr 1fr;gap:18px 18px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field-label{font-size:12px;color:#5f6876;display:flex;align-items:center;gap:8px;min-height:18px}.help{color:#9198a2;font-size:11px;font-weight:400}.field input,.field select{height:34px;width:100%;min-width:0;padding:0 10px;border:1px solid #cdd6e2;border-radius:6px;background:white;color:var(--text)}input::placeholder{color:#9ba3af}.field input[aria-invalid=true],.field select[aria-invalid=true]{border-color:#d74759}.field .error{font-size:11px;color:#c53648;min-height:0}.error:empty{display:none}.secret{position:relative}.secret input{padding-right:39px}.reveal{position:absolute;right:5px;top:4px;height:26px;width:29px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}.reveal svg{width:16px;height:16px}h2{font-size:13px;font-weight:500;display:flex;align-items:center;gap:12px;margin:24px 0 16px;color:#535d6a}h2:after{content:"";height:1px;flex:1;background:var(--line)}.extensions{height:246px}.switch{border:0;padding:2px;width:30px;height:17px;border-radius:12px;background:#9aa2ac;flex-shrink:0;display:flex;align-items:center}.switch:before{content:"";width:13px;height:13px;border-radius:50%;background:white;box-shadow:0 1px 2px #0002}.switch[aria-checked=true]{background:var(--accent)}.switch[aria-checked=true]:before{transform:translateX(13px)}.feature-label{display:flex;align-items:center;gap:10px;min-width:0}.feature-label strong{font-weight:500;font-size:13px}.desc{font-size:12px;color:var(--muted);margin-top:4px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.link{border:0;background:transparent;color:var(--accent);padding:0;font-size:12px}.field-label .link{margin-left:auto}.scope-note{font-size:11px;color:var(--muted);margin:9px 0 0}.row{display:grid;grid-template-columns:220px 1fr;gap:20px;height:112px;align-items:start}.row .feature-label{height:58px;align-items:center}.row .feature-label>div{align-self:flex-start}.row .feature-label strong{display:block;height:18px}.row .desc{padding-top:6px;margin:0}.row .switch{align-self:center}.row+.row{margin-top:12px}.invisible{visibility:hidden;pointer-events:none}.layout-b{display:grid;grid-template-columns:232px 1fr;gap:22px}.feature-menu{display:flex;flex-direction:column;gap:10px}.feature-card{position:relative;border:1px solid var(--line);border-radius:7px;background:white;min-height:99px;padding:0}.feature-card.selected{border-color:#bab2ff;background:#f8f6ff}.feature-card>.switch{position:absolute;left:12px;top:18px;z-index:1}.feature-tab{border:0;background:transparent;width:100%;text-align:left;padding:14px 12px 13px 52px;border-radius:7px;min-height:99px}.feature-tab strong{font-size:13px;font-weight:500}.feature-tab small{display:block;font-size:11px;color:var(--muted);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.feature-tab .status{margin-top:7px;color:var(--accent)}.feature-tab .status.off{color:#8a939e}.details{min-width:0;padding:1px 0}.details h3{font-size:13px;font-weight:500;margin:0 0 4px}.details .intro{margin:0 0 16px;color:var(--muted);font-size:12px}.layout-b .field-grid{grid-template-columns:1fr;gap:13px}.layout-b .scope-note{margin-top:8px}.disabled-panel{height:176px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);background:var(--soft);border-radius:7px}.disabled-panel p{margin:4px 0;font-size:12px}.disabled-panel .link{margin-top:8px}.inner-tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);height:36px;margin-bottom:17px}.inner-tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:0 2px 10px;display:flex;align-items:center;gap:7px;color:var(--muted)}.inner-tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}.dot{width:6px;height:6px;background:#acb3bc;border-radius:50%}.dot.on{background:#69ad91}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;height:24px}.panel-head .feature-label{gap:8px}.panel-head .desc{margin:0}.layout-c .disabled-panel{height:134px}.footer{height:65px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 24px}.btn{padding:7px 17px;border:1px solid var(--line);border-radius:6px;background:var(--soft)}.primary{background:var(--accent);border-color:var(--accent);color:white}.preview-tools{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:#fff;padding:8px 12px;border:1px solid var(--line);border-radius:8px;box-shadow:0 3px 12px #0001;white-space:nowrap;font-size:12px}.preview-tools span{color:var(--muted);margin-right:4px}.preview-tools button{border:0;background:var(--soft);border-radius:4px;padding:5px 10px}.toast{position:fixed;top:104px;left:50%;transform:translateX(-50%);background:white;border:1px solid var(--line);border-radius:7px;box-shadow:0 5px 18px #0001;padding:10px 18px;z-index:5}.toast:empty{display:none}@media(max-width:820px){.review{flex-wrap:wrap;padding:14px 16px}.stage{align-items:flex-start}.modal{min-width:660px}.stage{justify-content:flex-start;overflow:auto}.preview-tools{position:static;transform:none;justify-content:center}.schemes button{padding:6px 10px}}
.layout-c{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px}.layout-c .inner-tabs{flex-direction:column;gap:4px;height:100%;margin:0;padding-right:12px;border-bottom:0;border-right:1px solid var(--line)}.layout-c .inner-tabs button{height:42px;padding:0 12px;border:0;border-left:2px solid transparent;border-radius:0;text-align:left;white-space:nowrap}.layout-c .inner-tabs button[aria-selected=true]{background:var(--tint);border-left-color:var(--accent)}.layout-c .inner-tabs .dot{margin-left:auto}.layout-c [role=tabpanel]{min-width:0;padding-top:7px}.layout-c .panel-head{height:auto;display:block;margin-bottom:16px}.layout-c .panel-head .desc{margin:7px 0 0 38px}.layout-c .field-grid{grid-template-columns:1fr;gap:12px}.layout-c .disabled-panel{height:155px}
</style></head>
<body>
<header class="review"><div><strong>渠道应用鉴权 · 三种布局</strong><p id="scheme-note"></p></div><nav class="schemes" aria-label="原型布局"><button data-scheme="a" aria-pressed="false">A · 双行展开</button><button data-scheme="b" aria-pressed="false">B · 左右配置</button><button data-scheme="c" aria-pressed="true">C · 纵向 Tab</button></nav></header>
<main class="stage"><section class="modal" role="dialog" aria-modal="false" aria-labelledby="modal-title"><form id="form" autocomplete="off"><header class="head"><h1 id="modal-title">企微机器人</h1><small>企微智能机器人</small><span class="badge">WebSocket</span><button type="button" class="close" aria-label="关闭弹窗">×</button></header><div class="body"><div class="base"><label class="field"><span class="field-label">渠道名称</span><input value="企微机器人" placeholder="请输入"></label><label class="field"><span class="field-label">绑定 Agent</span><select><option>企微助手</option><option>DeepCube 助手</option></select></label><label class="field"><span class="field-label">Bot ID</span><input value="aibot_demo_001" placeholder="请输入"></label><label class="field"><span class="field-label">Secret</span><input type="password" value="demo-only-secret" placeholder="请输入"></label><label class="field"><span class="field-label">会话用户 <span class="help">使用平台账号记录渠道会话</span></span><input value="user-demo-001" placeholder="请输入"></label></div><h2>扩展设置</h2><div class="extensions" id="extensions"></div></div><footer class="footer"><button type="button" class="btn" id="cancel">取消</button><button type="submit" class="btn primary">保存</button></footer></form></section></main>
<div class="preview-tools"><span>预览状态</span><button data-preset="on">全部开启</button><button data-preset="off">全部关闭</button><button data-preset="empty">开启待配置</button><button data-preset="default">新建默认</button></div><div class="toast" role="status"></div>
<script>
const example={app:'iirjgi007',key:'demo-only-platform-api-key',wecom:'local',deepfos:true,member:true};
let state={...example},scheme='c',active='deepfos',errors={},showKey=false,timer;
const names={deepfos:'关联 DeepFOS 应用',member:'查询用户详情'};
const descriptions={deepfos:'设置应用上下文与访问凭据',member:'获取企微成员账号和姓名'};
const notes={a:'两个功能同时可见，配置字段并排；延续当前弹窗结构。',b:'左侧卡片回显功能状态，右侧统一配置；切换时保留输入和弹窗高度。',c:'左侧纵向 Tab 切换功能，右侧展示配置；简洁导航，开关与字段统一放在详情区。'};
const e=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toggle(key){return `<button type="button" class="switch" role="switch" aria-label="${names[key]}" aria-checked="${state[key]}" data-toggle="${key}"></button>`}
function fields(key){if(key==='member')return `<div class="field-grid"><label class="field"><span class="field-label">企微应用<button type="button" class="link" data-clear="wecom">清空</button></span><select data-field="wecom" aria-label="企微应用" aria-invalid="${!!errors.wecom}"><option value="">请选择</option><option value="local" ${state.wecom==='local'?'selected':''}>本地企微成员查询</option><option value="company" ${state.wecom==='company'?'selected':''}>企业成员查询</option></select><span class="error">${errors.wecom||''}</span></label></div>`;
return `<div class="field-grid"><label class="field"><span class="field-label">App ID</span><input data-field="app" value="${e(state.app)}" placeholder="请输入" aria-invalid="${!!errors.app}"><span class="error">${errors.app||''}</span></label><label class="field"><span class="field-label">API Key</span><span class="secret"><input data-field="key" type="${showKey?'text':'password'}" value="${e(state.key)}" placeholder="请输入" aria-invalid="${!!errors.key}" autocomplete="new-password"><button type="button" class="reveal" aria-label="${showKey?'隐藏':'显示'} API Key" id="reveal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>${showKey?'<path d="m3 3 18 18"/>':''}</svg></button></span><span class="error">${errors.key||''}</span></label></div><p class="scope-note">使用该空间的 API Key，需包含当前应用的访问权限。</p>`}
function disabled(key){return `<div class="disabled-panel"><p>${names[key]}未开启</p><p>开启后配置${key==='deepfos'?' App ID 和 API Key':'企微应用'}</p><button type="button" class="link" data-toggle="${key}">开启功能</button></div>`}
function status(key){if(!state[key])return '未开启';if(key==='deepfos')return state.app&&state.key?'API Key 已填写':'待配置';return state.wecom?'已配置':'待配置'}
function render(){document.getElementById('scheme-note').textContent=notes[scheme];document.querySelectorAll('[data-scheme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scheme===scheme)));
const root=document.getElementById('extensions');root.className='extensions layout-'+scheme;
if(scheme==='a')root.innerHTML=['deepfos','member'].map(key=>`<div class="row"><div class="feature-label">${toggle(key)}<div><strong>${names[key]}</strong><div class="desc">${descriptions[key]}</div></div></div><div class="${state[key]?'':'invisible'}" ${state[key]?'':'inert aria-hidden="true"'}>${fields(key)}</div></div>`).join('');
if(scheme==='b')root.innerHTML=`<div class="feature-menu" role="tablist" aria-label="扩展功能">${['deepfos','member'].map(key=>`<div class="feature-card ${active===key?'selected':''}">${toggle(key)}<button type="button" class="feature-tab" role="tab" aria-selected="${active===key}" data-active="${key}"><strong>${names[key]}</strong><small>${key==='deepfos'?(state.deepfos?(e(state.app)||'App ID 未填写'):'设置应用上下文与访问凭据'):(state.member&&state.wecom?(state.wecom==='local'?'本地企微成员查询':'企业成员查询'):'获取企微成员账号和姓名')}</small><small class="status ${state[key]?'':'off'}">${status(key)}</small></button></div>`).join('')}</div><div class="details" role="tabpanel"><h3>${names[active]}</h3><p class="intro">${descriptions[active]}</p>${state[active]?fields(active):disabled(active)}</div>`;
if(scheme==='c')root.innerHTML=`<div class="inner-tabs" role="tablist" aria-orientation="vertical" aria-label="扩展功能">${['deepfos','member'].map(key=>`<button type="button" role="tab" aria-selected="${active===key}" data-active="${key}">${names[key]}<span class="dot ${state[key]?'on':''}" title="${status(key)}"></span></button>`).join('')}</div><div role="tabpanel"><div class="panel-head"><div class="feature-label">${toggle(active)}<span>启用${active==='deepfos'?'应用关联':'用户详情查询'}</span></div><div class="desc">${descriptions[active]}</div></div>${state[active]?fields(active):disabled(active)}</div>`;
}
function notice(text){document.querySelector('.toast').textContent=text;clearTimeout(timer);timer=setTimeout(()=>document.querySelector('.toast').textContent='',3000)}
document.addEventListener('input',event=>{const key=event.target.dataset.field;if(key)state[key]=event.target.value});
document.addEventListener('change',event=>{if(event.target.dataset.field==='wecom'){state.wecom=event.target.value;render()}});
document.addEventListener('focusout',event=>{if(scheme==='b'&&event.target.dataset.field){const labels=document.querySelectorAll('.feature-tab');labels.forEach(b=>{const k=b.dataset.active;b.querySelector('.status').textContent=status(k);if(k==='deepfos'&&state.deepfos)b.querySelector('small').textContent=state.app||'App ID 未填写'})}});
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.scheme){scheme=b.dataset.scheme;errors={};render()}else if(b.dataset.active){active=b.dataset.active;render()}else if(b.dataset.toggle){const key=b.dataset.toggle;state[key]=!state[key];errors={};render()}else if(b.dataset.clear){state[b.dataset.clear]='';render()}else if(b.id==='reveal'){showKey=!showKey;render()}else if(b.dataset.preset){state={...example};errors={};showKey=false;if(b.dataset.preset==='off')state.deepfos=state.member=false;if(b.dataset.preset==='empty'){state.app=state.key=state.wecom=''}if(b.dataset.preset==='default')state={deepfos:false,member:false,app:'',key:'',wecom:''};render()}else if(b.id==='cancel'||b.classList.contains('close'))notice('布局预览：未修改任何真实配置')});
document.getElementById('form').addEventListener('submit',event=>{event.preventDefault();errors={};if(state.deepfos){if(!state.app.trim())errors.app='请输入 App ID';if(!state.key.trim())errors.key='请输入 API Key'}if(state.member&&!state.wecom)errors.wecom='请选择企微应用';if(Object.keys(errors).length){active=errors.app||errors.key?'deepfos':'member';render()}else notice('原型保存成功 · 仅演示交互，不会发送或保存真实凭据')});render();
</script></body></html>
