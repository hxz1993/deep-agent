const MODELS=[{id:'mdl_ds',name:'deepseek-flash',provider:'DeepSeek'},{id:'mdl_gpt',name:'gpt-5.4',provider:'OpenAI'},{id:'mdl_qwen',name:'qwen-plus',provider:'阿里云'},{id:'mdl_7f3a',name:'旧模型',provider:'历史 Provider',deleted:true},{id:'mdl_ds2',name:'deepseek-reasoner',provider:'DeepSeek'},{id:'mdl_qwen2',name:'qwen-max',provider:'阿里云'},{id:'mdl_gpt2',name:'gpt-4.1',provider:'OpenAI'},{id:'mdl_gpt3',name:'gpt-4.1-mini',provider:'OpenAI'},{id:'mdl_qwen3',name:'qwen-plus',provider:'团队网关'},{id:'mdl_ds3',name:'deepseek-flash',provider:'团队网关'},{id:'mdl_gpt4',name:'gpt-4o',provider:'OpenAI'},{id:'mdl_old2',name:'历史测试模型',provider:'旧网关',deleted:true}];
const PURPOSES=['聊天','标题','压缩'];
const state={layout:'a',days:7,start:'2026-09-17',end:'2026-09-23',user:'all',agent:'all',model:'all',metric:'total',group:'agent',chart:'bar',requests:true,hidden:new Set(),table:'model',page:1,sort:'total',descending:true,query:'',selection:null};
const DATA=[];for(let day=0;day<92;day++){const date=new Date(Date.UTC(2026,5,24+day)).toISOString().slice(0,10);for(let u=0;u<6;u++){const count=Math.max(1,Math.round((6-u)*((day*7%11)+4)/4));for(let r=0;r<count;r++){const a=(r+u+day)%3,m=(r*3+u+day)%14<6?0:(r*3+u*2+day)%11+1,p=r%11===0?2:r%5===0?1:0;const input=p===1?350+(day*31+r*13)%750:p===2?12500+(day*119+r*677)%13500:1400+(day*521+r*859+u*235)%6500;const output=p===1?25+(r+day)%35:p===2?1000+(day*17+r*59)%800:100+(day*59+r*101)%950;DATA.push({id:`${day}-${u}-${r}`,date,user:USERS[u],agent:AGENTS[a],model:MODELS[m].id,purpose:PURPOSES[p],input,output,total:input+output,requests:1,cache:Math.floor(input*((day+r)%7)/9)});}}}
const initialOptions=(values,first)=>`<option value="all">${first}</option>`+values.map(v=>`<option value="${v.value||v}">${v.label||v}</option>`).join('');
$('#agentFilter').innerHTML=initialOptions(AGENTS,'全部 Agent');all('[data-glyph]').forEach(e=>e.innerHTML=SESSION_ICONS[e.dataset.glyph]);
$('#navigation').innerHTML=[['test','测试'],['agent','Agent'],['integration','集成'],['signal','渠道'],[null,'设置'],['model','模型'],['tool','工具'],['plug','MCP'],['book','Skill'],[null,'诊断'],['list','日志'],['chat','会话'],['chart','用量']].map(([i,t])=>i?`<div class="nav ${t==='用量'?'active':''}">${icon(i)}<span>${t}</span></div>`:`<div class="section-label">${t}</div>`).join('');all('[data-icon]').forEach(e=>e.insertAdjacentHTML('afterbegin',icon(e.dataset.icon)));
const rangeStart=()=>state.start;
function filtered(){return DATA.filter(r=>r.date>=rangeStart()&&r.date<=state.end&&(state.user==='all'||r.user===state.user)&&(state.agent==='all'||r.agent===state.agent)&&(state.model==='all'||r.model===state.model));}
function sum(rows){return rows.reduce((a,r)=>{for(const k of ['input','output','total','requests','cache'])a[k]+=r[k];return a;},{input:0,output:0,total:0,requests:0,cache:0});}
function groups(rows,dim){const map=new Map();for(const r of rows){const key=r[dim];if(!map.has(key))map.set(key,{key,rows:[]});map.get(key).rows.push(r);}return [...map.values()].map(g=>({...g,...sum(g.rows)})).sort((a,b)=>b.total-a.total);}
function nameFor(key,dim){if(dim==='model'){const m=MODELS.find(m=>m.id===key);if(!m)return key;return m.deleted?'已删除 · '+m.name:m.name;}return key;}
function summary(rows){const t=sum(rows);return `<section class="summary" aria-label="筛选范围汇总">${[['累计 Token','total','Token','Layers3','purple'],['输入','input','Token','ArrowDownToLine','blue'],['输出','output','Token','ArrowUpFromLine','green'],['模型请求','requests','次','Activity','orange']].map(([label,key,unit,glyph,tone])=>`<div class="stat"><span class="stat-icon ${tone}">${SESSION_ICONS[glyph]}</span><div class="stat-copy"><div class="stat-label">${label}</div><div class="stat-value" data-stat="${key}">${fmt(t[key])}<small>${unit}</small></div></div></div>`).join('')}</section>`;}
function option(values,selected){return values.map(([v,t])=>`<option value="${v}" ${v===selected?'selected':''}>${t}</option>`).join('');}
function trendCard(title='用量趋势'){return `<section class="surface trend"><div class="surface-head"><div><h2>${title}</h2><div class="sub">按日查看 Token 与模型请求次数</div></div><div class="tools"><select id="metric" aria-label="趋势指标">${option([['total','总 Token'],['input','输入 Token'],['output','输出 Token']],state.metric)}</select><select id="group" aria-label="趋势分组">${option([['agent','按 Agent'],['purpose','按用途'],['model','按模型 · Top3'],['user','按用户 · Top3']],state.group)}</select><label class="requests-control" title="深色虚线使用右侧坐标轴，统计所有分组的请求次数"><input id="requestsToggle" type="checkbox" ${state.requests?'checked':''}><span>请求次数</span><i class="request-line"></i></label></div></div><div class="chart-content"><div class="axis-note"><span id="axisLabel">Token · 左轴</span><span id="rightAxisLabel">请求次数 · 右轴</span></div><svg id="trendSvg" class="chart-canvas" role="img" aria-label="每日 Token 与请求次数双轴图"></svg></div><div class="legend" id="legend"></div></section>`;}
function distribution(rows,compact=false){const total=sum(rows).total,gs=groups(rows,'purpose');return `<section class="surface"><div class="surface-head"><div><h2>用途分布</h2><div class="sub">同一时间范围 · 按 Token</div></div><span class="small muted">${gs.length} 类</span></div><div class="distribution"><div class="stack-bar" aria-label="用途占比">${gs.map((g,i)=>`<i title="${g.key} ${pct(g.total,total)}" style="--c:${COLORS[i]};width:${total?g.total/total*100:0}%"></i>`).join('')}</div>${gs.map((g,i)=>`<div class="dist-row"><i class="bullet" style="--c:${COLORS[i]}"></i><span>${g.key}</span><span class="num">${short(g.total)}</span><span class="pct">${pct(g.total,total)}</span></div>`).join('')||'<div class="empty">暂无数据</div>'}${compact?'':`<div class="dist-rule"></div><h3>用户用量 <span class="muted small">Top 3 + 其他</span></h3>${rankRows(rows)}`}</div></section>`;}
function rankRows(rows){const gs=groups(rows,'user'),show=gs.slice(0,3);if(gs.length>3)show.push({key:'其他',total:gs.slice(3).reduce((a,b)=>a+b.total,0)});const max=Math.max(1,...show.map(g=>g.total));return show.map((g,i)=>`<div class="rank-row"><span>${g.key}</span><span class="track"><i style="--c:${COLORS[i]};width:${g.total/max*100}%"></i></span><span class="num">${short(g.total)}</span></div>`).join('');}
function rankingCard(rows){return `<section class="surface ranking-card"><div class="surface-head"><div><h2>用户用量</h2><div class="sub">Top 3 + 其他 · 按 Token</div></div><button class="text-btn small" id="viewUsers">查看明细 →</button></div><div class="distribution">${rankRows(rows)}</div></section>`;}
function tableCard(){return `<section class="surface main-table"><div class="surface-head table-head"><div><h2>用量明细</h2><div class="sub">按当前筛选范围汇总</div></div><div class="tools"><select id="tableDimension" aria-label="明细统计维度">${option([['model','按模型'],['user','按用户'],['agent','按 Agent'],['purpose','按用途'],['date','按日期']],state.table)}</select></div></div><div class="detail-toolbar"><input class="search" id="tableSearch" placeholder="搜索名称 / Provider" aria-label="搜索明细" value="${state.query.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}"><button class="text-btn small" id="exportButton">${icon('download')}导出</button></div><div class="table-wrap" id="tableBody"></div><div class="table-footer"><span id="tableCount"></span><div class="pager"><button id="previousPage" aria-label="上一页" title="上一页">‹</button><span id="pageNumber"></span><button id="nextPage" aria-label="下一页" title="下一页">›</button></div></div></section>`;}
let chartRows=[],chartInfo=null,pinned=false;
function selectedRows(rows){return state.selection?rows.filter(r=>r[state.table]===state.selection):rows;}
function render(){hideTip();const rows=filtered();$('#dateLabel').textContent=state.start.replaceAll('-','/')+' — '+state.end.replaceAll('-','/');$('#content').className='layout-a';
$('#content').innerHTML=`<div class="analysis-split"><div class="left-pane">${summary(rows)}${trendCard()}<div class="mini-blocks">${distribution(rows,true)}${rankingCard(rows)}</div></div>${tableCard()}</div>`;
chartRows=rows;renderTable();renderChart();$('#metric').onchange=e=>{state.metric=e.target.value;renderChart();};$('#group').onchange=e=>{state.group=e.target.value;state.hidden.clear();renderChart();};$('#requestsToggle').onchange=e=>{state.requests=e.target.checked;renderChart();};$('#tableDimension').onchange=e=>{state.table=e.target.value;state.page=1;state.query='';state.sort='total';state.descending=true;render();};$('#tableSearch').oninput=e=>{state.query=e.target.value;state.page=1;renderTable();};$('#exportButton').onclick=exportTable;$('#viewUsers').onclick=()=>{state.table='user';state.page=1;state.query='';render();};}
function currentTable(){return groups(filtered(),state.table).filter(g=>(nameFor(g.key,state.table)+' '+g.key+(state.table==='model'?MODELS.find(m=>m.id===g.key).provider:'')).toLowerCase().includes(state.query.toLowerCase())).sort((a,b)=>{const d=state.sort==='key'?nameFor(a.key,state.table).localeCompare(nameFor(b.key,state.table),'zh'):a[state.sort]-b[state.sort];return state.descending?-d:d;});}
function renderTable(){const rows=currentTable(),pages=Math.max(1,Math.ceil(rows.length/10));state.page=Math.min(Math.max(1,state.page),pages);const offset=(state.page-1)*10,visible=rows.slice(offset,offset+10);
$('#tableBody').innerHTML=`<table class="usage-table"><thead><tr>${[['key',{user:'用户',model:'模型',agent:'Agent',purpose:'用途',date:'日期'}[state.table]],['requests','请求'],['input','输入'],['output','输出'],['total','总 Token']].map(([k,t])=>`<th aria-sort="${state.sort===k?(state.descending?'descending':'ascending'):'none'}"><button data-sort="${k}">${t} ${state.sort===k?(state.descending?'↓':'↑'):'↕'}</button></th>`).join('')}</tr></thead><tbody>${visible.map(g=>{const model=state.table==='model'?MODELS.find(m=>m.id===g.key):null;const title=nameFor(g.key,state.table)+(model?' · '+model.provider+' · '+model.id:'');return `<tr data-row="${g.key}" tabindex="0" aria-label="查看 ${title} 的用量"><td title="${title}"><div class="cell-main"><span>${nameFor(g.key,state.table)}</span>${model?`<span class="inline-provider">· ${model.provider}</span>`:''}</div></td><td>${fmt(g.requests)}</td><td>${fmt(g.input)}</td><td>${fmt(g.output)}</td><td><strong style="font-weight:570">${fmt(g.total)}</strong></td></tr>`;}).join('')||'<tr><td colspan="5"><div class="empty">没有匹配的记录</div></td></tr>'}</tbody><tfoot><tr><td title="包含全部分页中的匹配记录">${state.query?'匹配合计':'全部合计'}</td>${['requests','input','output','total'].map(k=>`<td>${fmt(rows.reduce((a,r)=>a+r[k],0))}</td>`).join('')}</tr></tfoot></table>`;
$('#tableCount').textContent=rows.length?`${offset+1}–${Math.min(offset+10,rows.length)} / ${rows.length} 项`:'0 项';$('#pageNumber').textContent=`${state.page} / ${pages}`;$('#previousPage').disabled=state.page===1;$('#nextPage').disabled=state.page===pages;$('#previousPage').onclick=()=>{if(state.page>1){state.page--;renderTable();}};$('#nextPage').onclick=()=>{if(state.page<pages){state.page++;renderTable();}};
all('[data-sort]').forEach(b=>b.onclick=()=>{if(state.sort===b.dataset.sort)state.descending=!state.descending;else{state.sort=b.dataset.sort;state.descending=true;}state.page=1;renderTable();});all('[data-row]').forEach(tr=>{const go=()=>showDetails(tr.dataset.row);tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});}
function niceMax(v){if(!v)return 4;const rough=v/4,p=10**Math.floor(Math.log10(rough)),unit=Math.ceil(rough/p)*p;return unit*4;}
function seriesData(){const ranked=groups(chartRows,state.group),top=ranked.slice(0,3),keys=top.map(g=>g.key);if(ranked.length>3)top.push({key:'其他',total:ranked.slice(3).reduce((a,g)=>a+g.total,0)});const dates=Array.from({length:state.days},(_,i)=>new Date(Date.parse(state.start+'T00:00:00Z')+i*86400000).toISOString().slice(0,10));const daily=dates.map(date=>{const rows=chartRows.filter(r=>r.date===date);return {date,requests:rows.length,values:top.map(g=>sum(rows.filter(r=>g.key==='其他'?!keys.includes(r[state.group]):r[state.group]===g.key))[state.metric])};});return {series:top,daily};}
function renderChart(){hideTip();const svg=$('#trendSvg');if(!svg)return;const {series,daily}=seriesData(),W=Math.max(400,Math.round(svg.getBoundingClientRect().width)),H=Math.round(svg.getBoundingClientRect().height)||232,L=48,R=46,T=15,B=32,pw=W-L-R,ph=H-T-B,step=pw/state.days;const tokenMax=niceMax(Math.max(0,...daily.map(d=>d.values.reduce((a,b)=>a+b,0)))),reqMax=niceMax(Math.max(0,...daily.map(d=>d.requests)));const x=i=>L+step*(i+.5),y=v=>T+ph-v/tokenMax*ph,yr=v=>T+ph-v/reqMax*ph;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);$('#axisLabel').textContent={total:'总 Token',input:'输入 Token',output:'输出 Token'}[state.metric]+' · 左轴';$('#rightAxisLabel').textContent=state.requests?'请求次数 · 右轴':'';let parts=[];for(let t=0;t<=4;t++){const yy=T+ph-t*ph/4;parts.push(`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#ececf2"/><text x="${L-10}" y="${yy+3}" text-anchor="end">${short(tokenMax*t/4)}</text>${state.requests?`<text x="${W-R+10}" y="${yy+3}">${fmt(reqMax*t/4)}</text>`:''}`);}daily.forEach((d,i)=>{let accum=0;d.values.forEach((v,j)=>{if(state.hidden.has(series[j].key))return;const h=v/tokenMax*ph,bw=Math.min(34,step*.5);parts.push(`<rect x="${x(i)-bw/2}" y="${y(accum+v)}" width="${bw}" height="${h}" fill="${COLORS[j]}" rx="1.5"/>`);accum+=v;});});if(state.requests){parts.push(`<polyline points="${daily.map((d,i)=>`${x(i)},${yr(d.requests)}`).join(' ')}" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="4 4" stroke-linejoin="round"/>`);if(state.days<=7)daily.forEach((d,i)=>parts.push(`<circle cx="${x(i)}" cy="${yr(d.requests)}" r="2.7" fill="white" stroke="#64748b" stroke-width="1.5"/>`));}daily.forEach((d,i)=>{const skip=state.days>7?Math.ceil(state.days/7):1;if(i%skip===0||i===state.days-1)parts.push(`<text x="${x(i)}" y="${H-9}" text-anchor="middle">${d.date.slice(5).replace('-','/')}</text>`);parts.push(`<g class="chart-hit" data-day="${i}" tabindex="0" role="button" aria-label="${d.date}，Token ${fmt(d.values.reduce((a,b)=>a+b,0))}，请求 ${d.requests} 次"><rect x="${L+step*i}" y="${T}" width="${step}" height="${ph}" fill="transparent"/></g>`);});svg.innerHTML=parts.join('');$('#legend').innerHTML=series.map((s,i)=>{const n=daily.reduce((a,d)=>a+d.values[i],0),den=daily.reduce((a,d)=>a+d.values.reduce((a,b)=>a+b,0),0);return `<button data-series="${s.key}" aria-pressed="${!state.hidden.has(s.key)}" title="显示/隐藏图表中的 ${nameFor(s.key,state.group)}，不影响汇总与表格"><i class="swatch" style="--c:${COLORS[i]}"></i><span><span class="legend-name">${s.key==='其他'?'其他':nameFor(s.key,state.group)}</span><span class="legend-value">${pct(n,den)}<small>${short(n)}</small></span></span></button>`;}).join('')||'<span class="muted small">此范围内没有已报告用量</span>';chartInfo={series,daily};all('[data-series]').forEach(b=>b.onclick=()=>{state.hidden.has(b.dataset.series)?state.hidden.delete(b.dataset.series):state.hidden.add(b.dataset.series);renderChart();});all('[data-day]').forEach(g=>{g.onpointermove=e=>{if(!pinned)showTip(Number(g.dataset.day),e.clientX,e.clientY);};g.onpointerleave=()=>{if(!pinned)$('#tip').style.display='none';};g.onclick=e=>{pinned=true;showTip(Number(g.dataset.day),e.clientX,e.clientY);};g.onfocus=()=>{const r=g.getBoundingClientRect();showTip(Number(g.dataset.day),r.x+r.width/2,r.y+45);};g.onblur=()=>{if(!pinned)$('#tip').style.display='none';};g.onkeydown=e=>{if(e.key==='Escape')hideTip();};});}
function showTip(i,x,y){const d=chartInfo.daily[i];$('#tip').innerHTML=`<strong>${d.date}</strong>${chartInfo.series.map((s,j)=>`<div class="tip-row"><span><i style="--c:${COLORS[j]}"></i>${s.key==='其他'?'其他':nameFor(s.key,state.group)}</span><b>${fmt(d.values[j])}</b></div>`).join('')}<div class="tip-row" style="border-top:1px solid var(--line);margin-top:5px;padding-top:4px"><span>${{total:'总 Token',input:'输入 Token',output:'输出 Token'}[state.metric]}</span><b>${fmt(d.values.reduce((a,b)=>a+b,0))}</b></div><div class="tip-row"><span>模型请求</span><b>${d.requests} 次</b></div><small>${pinned?'已固定 · 按 Esc 关闭':'点击固定 · 数值包含隐藏分组'}</small>`;const tip=$('#tip');tip.style.display='block';tip.style.left=Math.min(window.innerWidth-tip.offsetWidth-12,Math.max(12,x+15))+'px';tip.style.top=Math.min(window.innerHeight-tip.offsetHeight-12,Math.max(12,y+12))+'px';}
function hideTip(){pinned=false;$('#tip').style.display='none';}
function showDetails(key){const rows=filtered().filter(r=>r[state.table]===key);$('#dialogTitle').textContent=nameFor(key,state.table)+' · 用量构成';$('#dialogBody').innerHTML=`<div class="muted small">${rangeStart()} — ${state.end} · 示例数据</div>${summary(rows)}<h3>按${state.table==='model'?'用途':'模型'}汇总</h3>${groups(rows,state.table==='model'?'purpose':'model').map(g=>`<div class="detail-list"><span>${nameFor(g.key,state.table==='model'?'purpose':'model')}</span><span>${fmt(g.total)} Token <span class="muted">/ ${g.requests} 次</span></span></div>`).join('')}<p class="small muted" style="margin-top:20px">同一模型请求仅计一次，包含聊天、标题和压缩。此处为原型示例。</p>`;$('#detailDialog').showModal();}
function exportTable(){const rows=currentTable(),labels=['名称','模型ID','Provider','请求次数','输入Token','输出Token','总Token'];const csv='\ufeff'+[labels,...rows.map(r=>[nameFor(r.key,state.table),state.table==='model'?r.key:'',state.table==='model'?MODELS.find(m=>m.id===r.key).provider:'',r.requests,r.input,r.output,r.total])].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='DeepAgent-用量示例-'+state.table+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前明细（示例数据）');}
let toastTimer;function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',2500);}
function presetRange(period){const end='2026-09-23';const relative=days=>({start:new Date(Date.parse(end+'T00:00:00Z')-(days-1)*86400000).toISOString().slice(0,10),end});if(period==='today')return relative(1);if(period==='yesterday')return {start:'2026-09-22',end:'2026-09-22'};if(period==='week')return {start:'2026-09-21',end};if(period==='month')return {start:'2026-09-01',end};if(period==='lastMonth')return {start:'2026-08-01',end:'2026-08-31'};if(period==='custom')return {start:$('#customStart').value,end:$('#customEnd').value};return relative(Number(period));}
function applyQuery(){const range=presetRange($('#periodFilter').value),start=Date.parse(range.start+'T00:00:00Z'),end=Date.parse(range.end+'T00:00:00Z'),days=Math.round((end-start)/86400000)+1;if(!Number.isFinite(days)||days<1||days>31||range.start<'2026-06-24'||range.end>'2026-09-23'){toast('请选择有效日期范围：最多 31 天，示例截止 2026/09/23');return false;}Object.assign(state,{...range,days,agent:$('#agentFilter').value,page:1,selection:null});$('#customRange').hidden=true;state.hidden.clear();render();return true;}
$('#usageFilters').onsubmit=e=>{e.preventDefault();applyQuery();};$('#periodFilter').onchange=e=>{const custom=e.target.value==='custom';$('#customRange').hidden=!custom;$('#customStart').disabled=!custom;$('#customEnd').disabled=!custom;};$('#resetButton').onclick=()=>{$('#periodFilter').value='7';$('#customStart').disabled=true;$('#customEnd').disabled=true;$('#agentFilter').value='all';$('#customStart').value='2026-09-17';$('#customEnd').value='2026-09-23';applyQuery();};
$('#closeDialog').onclick=()=>$('#detailDialog').close();$('#detailDialog').onclick=e=>{if(e.target===$('#detailDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}};document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideTip();$('#customRange').hidden=true;}});window.addEventListener('scroll',hideTip,{passive:true});let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(renderChart,80);});render();
</script>
