<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>渠道扩展设置 · 三种布局</title>
<style>
:root{--accent:#4f46e5;--text:#24292f;--dim:#68717e;--line:#d8e0e9;--muted:#f6f8fa;--danger:#cf3444}*{box-sizing:border-box}body{margin:0;color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#e7eaee}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8c86ff;outline-offset:2px}.review{min-height:94px;background:#fff;border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.review strong{font-size:14px}.review p{margin:3px 0 0;color:var(--dim);font-size:12px}.tabs{display:flex;padding:3px;background:var(--muted);border:1px solid var(--line);border-radius:8px;gap:3px}.tabs button{border:0;padding:7px 13px;background:transparent;border-radius:5px;color:var(--dim);white-space:nowrap}.tabs button[aria-pressed=true]{background:white;box-shadow:0 1px 4px #18243b14;color:var(--accent)}.stage{min-height:calc(100vh - 94px);padding:35px 18px 80px;background:#24292f38;display:flex;align-items:center;justify-content:center}.modal{width:720px;max-width:100%;border:1px solid #d0d7de;border-radius:16px;background:#fff;box-shadow:0 18px 56px #202b3b20;overflow:hidden}.head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.head h1{font-size:16px;margin:0;font-weight:600}.sub{color:var(--dim);font-size:12px}.tag{color:var(--accent);background:#eeebff;font-size:11px;border-radius:3px;padding:2px 6px}.icon{margin-left:auto;width:28px;height:28px;border:0;background:transparent;color:var(--dim);display:grid;place-items:center;border-radius:5px}.icon:hover{background:var(--muted)}.body{padding:22px 24px 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field>span{font-size:12px;color:var(--dim)}input,select{height:34px;width:100%;min-width:0;border:1px solid #cfd8e3;border-radius:6px;padding:0 10px;background:white;color:var(--text)}input::placeholder{color:#9aa3ae}input:disabled,select:disabled{background:#f6f8fa;border-color:#e5e9ee;color:#a1a8b2;cursor:not-allowed}input[aria-invalid=true],select[aria-invalid=true]{border-color:var(--danger)}.wide{grid-column:1 / -1}.userline{display:flex;gap:8px;align-items:center}.hint{font-size:11px;font-weight:400;color:#8c95a0}.userinput{width:calc(50% - 8px)}h2{display:flex;align-items:center;gap:12px;margin:28px 0 12px;font-size:13px;font-weight:500;color:var(--dim)}h2:after{content:"";height:1px;background:var(--line);flex:1}.extensions{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.row{display:grid;grid-template-columns:210px 38px minmax(0,1fr);gap:16px;align-items:center;min-height:82px;padding:15px 0}.row+.row{border-top:1px solid #e8edf2}.label{font-size:13px;font-weight:500}.desc{color:#88919d;font-size:11px;margin-top:4px}.switch{width:30px;height:17px;border:0;border-radius:12px;background:#bdc5d0;padding:2px;display:flex;align-items:center;flex-shrink:0;transition:background .15s}.switch span{width:13px;height:13px;background:white;box-shadow:0 1px 2px #0002;border-radius:50%;transform:translateX(0);transition:transform .15s}.switch[aria-checked=true]{background:var(--accent)}.switch[aria-checked=true] span{transform:translateX(13px)}.control{min-width:0}.controlhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;font-size:11px;color:var(--dim)}.clear{border:0;background:transparent;padding:0;color:var(--accent);font-size:11px}.clear:disabled{color:#a1a8b2;cursor:default}.error{font-size:11px;color:var(--danger);margin-top:4px}.error:empty{display:none}.foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line)}.btn{height:36px;padding:0 17px;border:1px solid #d0d7de;border-radius:7px;background:#f6f8fa;color:var(--text)}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.presets{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:7px 9px 7px 13px;display:flex;align-items:center;gap:7px;background:#fffffff5;border:1px solid var(--line);border-radius:9px;box-shadow:0 3px 12px #0001;font-size:11px;white-space:nowrap}.presets span{color:var(--dim);margin-right:4px}.presets button{border:0;border-radius:4px;background:#f0f2f6;padding:5px 10px;color:#4b5563}.toast{position:fixed;top:108px;left:50%;transform:translateX(-50%);border:1px solid #d5dfd9;background:white;box-shadow:0 4px 16px #0001;padding:9px 18px;border-radius:7px;font-size:12px;z-index:2}.toast:empty{display:none}.layout-b .row{grid-template-columns:30px 192px minmax(0,1fr);gap:14px}.layout-b .row>.switch{grid-column:1;grid-row:1}.layout-b .copy{grid-column:2;grid-row:1}.layout-b .control{grid-column:3;grid-row:1}.layout-b .controlhead{display:none}.layout-b .row{min-height:72px}.layout-c .row{grid-template-columns:1fr 30px;gap:12px;min-height:0;padding:15px 0}.layout-c .control{grid-column:1 / -1}.layout-c .controlhead{display:none}.layout-c .desc{display:inline;margin-left:10px}.layout-c .switch{grid-column:2;grid-row:1}.layout-c .control input,.layout-c .control select{height:34px}.layout-c .extensions{padding:0 14px;border:1px solid var(--line);border-radius:7px}.layout-c h2{margin-top:24px}.closed{padding:55px;text-align:center}.closed p{color:var(--dim)}@media(max-width:760px){.review{flex-direction:column;align-items:flex-start;padding:12px 16px}.stage{align-items:flex-start;padding-top:20px}.row{grid-template-columns:minmax(0,1fr) 30px;gap:10px}.row .control{grid-column:1 / -1}.layout-b .row{grid-template-columns:30px 1fr}.layout-b .control{grid-column:2;grid-row:2}.head{flex-wrap:wrap}.body{padding:18px}.grid{gap:14px}.userline{display:block}.userinput{width:100%}.presets{position:static;transform:none;justify-content:center;border-radius:0}.layout-c .desc{display:block;margin-left:0}}
</style>
<header class="review"><div><strong>渠道扩展设置 · 弹窗原型</strong><p id="description"></p></div><nav class="tabs" aria-label="布局方案"><button data-layout="a" aria-pressed="true">A · 对齐表格</button><button data-layout="b" aria-pressed="false">B · 开关前置</button><button data-layout="c" aria-pressed="false">C · 上下展开</button></nav></header>
<main class="stage"><section class="modal layout-a" id="modal" role="dialog" aria-modal="false" aria-labelledby="title"></section></main>
<div class="presets"><span>预览状态</span><button data-preset="on">全部开启</button><button data-preset="off">全部关闭</button><button data-preset="empty">开启未填写</button><button id="reset">重置</button></div><div class="toast" role="status" aria-live="polite"></div>
<script>
const initial={name:'先胜小D',agent:'先胜小D',bot:'aibot_demo_001',secret:'demo_secret',user:'user-demo-001',wecom:true,deepfos:true,wecomValue:'local',app:'iirjgi005'};
let state={...initial},layout='a',errors={},timer;
const descriptions={a:'推荐 · 名称、开关、配置三列对齐，两行即可扫完。',b:'开关在最左侧，右侧直接配置；行高更紧凑。',c:'每项单独一行区域，开启后在下方展开配置；阅读更从容。'};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(s){document.querySelector('.toast').textContent=s;clearTimeout(timer);timer=setTimeout(()=>document.querySelector('.toast').textContent='',3500)}
function extension(key,label,desc){const on=state[key],id=key==='wecom'?'wecomValue':'app',kind=key==='wecom'?'企微应用':'App ID';return `<div class="row"><div class="copy"><label class="label" id="${key}-label" for="${key}-toggle">${label}</label><div class="desc">${desc}</div></div><button type="button" class="switch" id="${key}-toggle" role="switch" aria-checked="${on}" aria-labelledby="${key}-label" data-toggle="${key}"><span></span></button><div class="control" ${layout==='c'&&!on?'hidden':''}><div class="controlhead"><label for="${id}">${kind}</label><button type="button" class="clear" data-clear="${id}" ${!on?'disabled':''}>清空</button></div>${key==='wecom'?`<select id="${id}" data-field="${id}" aria-label="企微应用" aria-invalid="${!!errors[id]}" ${!on?'disabled':''}><option value="">${on?'请选择企微应用':'开启后选择企微应用'}</option><option value="local" ${state.wecomValue==='local'?'selected':''}>本地企微成员查询</option><option value="service" ${state.wecomValue==='service'?'selected':''}>客户服务成员查询</option></select>`:`<input id="${id}" data-field="${id}" aria-label="DeepFOS App ID" aria-invalid="${!!errors[id]}" value="${escapeHtml(state.app)}" placeholder="${on?'请输入 DeepFOS App ID':'开启后填写 App ID'}" ${!on?'disabled':''}>`}<div class="error">${errors[id]||''}</div></div></div>`}
function render(){document.querySelector('#description').textContent=descriptions[layout];document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.layout===layout));const m=document.querySelector('#modal');m.className='modal layout-'+layout;m.innerHTML=`<form id="prototypeForm" novalidate><header class="head"><h1 id="title">先胜小D</h1><span class="sub">企微智能机器人</span><span class="tag">WebSocket</span><button type="button" class="icon" data-close aria-label="关闭弹窗"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><div class="body"><div class="grid"><label class="field"><span>渠道名称</span><input data-field="name" value="${escapeHtml(state.name)}"></label><label class="field"><span>绑定 Agent</span><select data-field="agent"><option>先胜小D</option><option ${state.agent==='工单助手'?'selected':''}>工单助手</option></select></label><label class="field"><span>Bot ID</span><input data-field="bot" value="${escapeHtml(state.bot)}"></label><label class="field"><span>Secret</span><input type="password" data-field="secret" autocomplete="off" value="${escapeHtml(state.secret)}"></label><label class="field wide"><span class="userline">会话用户 <small class="hint">使用此平台账号记录渠道会话。</small></span><input class="userinput" data-field="user" value="${escapeHtml(state.user)}"></label></div><h2>扩展设置</h2><div class="extensions">${extension('wecom','查询用户详情','获取企微成员账号和姓名。')}${extension('deepfos','关联deepfos应用','为渠道会话设置应用上下文。')}</div></div><footer class="foot"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn primary">保存</button></footer></form>`;}
document.addEventListener('input',e=>{if(e.target.dataset.field){state[e.target.dataset.field]=e.target.value;delete errors[e.target.dataset.field];e.target.setAttribute('aria-invalid','false');const er=e.target.closest('.control')?.querySelector('.error');if(er)er.textContent=''}});
document.addEventListener('change',e=>{if(e.target.dataset.field)state[e.target.dataset.field]=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.layout){layout=b.dataset.layout;render()}else if(b.dataset.toggle){const key=b.dataset.toggle;state[key]=!state[key];delete errors[key==='wecom'?'wecomValue':'app'];render();document.getElementById(key+'-toggle').focus()}else if(b.dataset.clear){state[b.dataset.clear]='';render();document.getElementById(b.dataset.clear).focus()}else if(b.dataset.preset){state.wecom=state.deepfos=b.dataset.preset!=='off';if(b.dataset.preset==='empty'){state.wecomValue='';state.app=''}else if(b.dataset.preset==='on'){state.wecomValue||='local';state.app||='iirjgi005'}errors={};render()}else if(b.id==='reset'||b.id==='reopen'){state={...initial};errors={};render()}else if(b.hasAttribute('data-close')){document.getElementById('modal').innerHTML='<div class="closed"><p>弹窗已关闭，未保存修改。</p><button class="btn primary" id="reopen">重新打开弹窗</button></div>'}});
document.addEventListener('submit',e=>{e.preventDefault();errors={};if(state.wecom&&!state.wecomValue)errors.wecomValue='请选择企微应用';if(state.deepfos&&!state.app.trim())errors.app='请输入 DeepFOS App ID';if(Object.keys(errors).length){render();document.getElementById(Object.keys(errors)[0]).focus()}else notice('原型校验通过 · 不会修改真实渠道配置')});render();
</script>
</html>
