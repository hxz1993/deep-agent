<!doctype html>
<html lang="zh-CN">
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-name">deep-agent</span>
        </div>
        <button class="icon-btn" id="newChatBtn" title="新建会话" aria-label="新建会话"><i data-lucide="plus"></i></button>
      </div>

      <button type="button" class="new-chat" id="newChatBtnWide" aria-haspopup="menu" aria-expanded="false">
        <span class="new-chat-label"><i data-lucide="plus"></i>新建对话</span>
        <span class="new-chat-chevron" aria-hidden="true"><i data-lucide="chevron-down"></i></span>
      </button>

      <div class="sidebar-section">
        <div class="section-title">历史会话</div>
        <ul class="session-list" id="sessionList"></ul>
      </div>

      <div class="sidebar-section grow">
        <div class="section-title">
          能力 (capabilities)
          <button class="link-btn" id="refreshCapsBtn">刷新</button>
        </div>
        <ul class="cap-list" id="capList">
          <li class="cap-empty">未加载</li>
        </ul>
      </div>

    </aside>

    <!-- 主聊天区 -->
    <main class="chat">
      <header class="chat-header">
        <button class="icon-btn ghost" id="toggleSidebar" title="切换侧边栏" aria-label="切换侧边栏"><i data-lucide="panel-left"></i></button>
        <div class="chat-title">
          <span id="chatTitle">新对话</span>
          <span class="session-badge session-subtitle" id="sessionBadge"></span>
        </div>
        <nav class="chat-view-tabs" id="chatViewTabs" role="tablist" aria-label="会话视图">
          <button type="button" class="chat-view-tab active" id="conversationViewTab" role="tab" aria-selected="true" aria-controls="messages" data-chat-view="conversation">对话</button>
          <button type="button" class="chat-view-tab" id="trajectoryViewTab" role="tab" aria-selected="false" aria-controls="trajectoryView" data-chat-view="trajectory">轨迹</button>
        </nav>
        <div class="chat-actions">
          <button type="button" class="workspace-header-action" data-open-context title="测试App" aria-label="测试App">
            <i data-lucide="waypoints"></i><span>测试App</span>
          </button>
          <button type="button" class="workspace-header-action active" id="toggleInspectorPaneBtn" title="隐藏详情" aria-label="显示或隐藏详情" aria-pressed="true">
            <i data-lucide="panel-right"></i><span>详情</span>
          </button>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <div class="empty-logo"><i data-lucide="bot" aria-hidden="true"></i></div>
          <h1>deep-agent 对话</h1>
          <p>输入消息开始与智能体对话。支持工具调用的实时流式输出。</p>
        </div>
      </div>

      <section class="trajectory-view hidden" id="trajectoryView" role="tabpanel" aria-labelledby="trajectoryViewTab">
        <header class="trajectory-toolbar">
          <div class="trajectory-modes" role="group" aria-label="轨迹筛选">
            <button type="button" class="active" data-trajectory-mode="sequence"><i data-lucide="clock-3"></i><span>顺序</span></button>
            <button type="button" data-trajectory-mode="calls"><i data-lucide="wrench"></i><span>调用</span><small id="trajectoryCallCount">0</small></button>
          </div>
          <div class="trajectory-actions">
            <label class="trajectory-search"><i data-lucide="search"></i><input type="search" id="trajectorySearch" placeholder="搜索轨迹" /></label>
            <button type="button" class="trajectory-export" id="exportTrajectoryBtn" title="导出当前会话的安全轨迹 JSON"><i data-lucide="download"></i><span>导出轨迹</span></button>
          </div>
        </header>
        <div class="trajectory-layout">
          <div class="trajectory-list" id="trajectoryList">
            <div class="trajectory-empty"><i data-lucide="route"></i><p>当前会话还没有可展示的轨迹。</p></div>
          </div>
        </div>
      </section>

      <div class="composer">
        <section class="composer-plan hidden open" id="composerPlan" aria-live="polite">
          <button type="button" class="composer-plan-summary" id="composerPlanSummary" aria-expanded="true">
            <span class="composer-plan-chevron"><i data-lucide="chevron-right" aria-hidden="true"></i></span>
            <span class="composer-plan-icon"><i data-lucide="list-checks" aria-hidden="true"></i></span>
            <span class="composer-plan-title">任务计划</span>
            <span class="composer-plan-progress" id="composerPlanProgress"></span>
          </button>
          <ol class="composer-plan-items" id="composerPlanItems"></ol>
        </section>
        <div class="attachment-preview hidden" id="attachmentPreview"></div>
        <div class="composer-meta" id="composerMeta">
          <label class="composer-model-picker">
            <span class="composer-model-label">模型</span>
            <select id="modelSelect" class="composer-model-select" title="选择本会话使用的 LLM 模型"></select>
          </label>
          <span class="composer-modalities" id="composerModelModalities"></span>
          <span class="composer-modalities" id="composerUploadCapabilities"></span>
        </div>
        <div class="composer-inner">
          <button type="button" class="composer-icon-btn attach-btn" id="attachBtn" title="添加附件" aria-label="添加附件">
            <i data-lucide="paperclip" aria-hidden="true"></i>
          </button>
          <button type="button" class="composer-icon-btn compact-context-btn" id="compactContextBtn" title="当前没有可压缩的会话历史" aria-label="压缩上下文" disabled>
            <i data-lucide="minimize-2" aria-hidden="true"></i>
          </button>
          <input type="file" id="fileInput" class="hidden" multiple accept="image/*,.docx,.xlsx,.txt,.log,.csv,.json,.md,.html,.xml,.mp3,.wav,.mp4" />
          <textarea
            id="input"
            rows="1"
            placeholder="给 Agent 发送消息…（Enter 发送，Shift+Enter 换行）"
          ></textarea>
          <button type="button" class="context-budget-badge" id="contextBudgetBadge" title="历史上下文估算尚不可用" aria-label="历史上下文估算">上下文 —</button>
          <button class="send-btn" id="sendBtn" title="发送">
            <i data-lucide="send" aria-hidden="true"></i>
          </button>
          <button class="stop-btn hidden" id="stopBtn" title="停止生成">
            <span class="stop-square"></span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <div class="new-chat-menu hidden" id="newChatMenu" role="menu" aria-label="选择 Agent 新建对话"></div>

</body>
</html>
