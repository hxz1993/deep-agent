[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepfos-agent-client"
version = "0.17.0a3"
description = "Async Python client and CLI for published DeepAgent agents"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
deepfos-agent = "deepfos_agent_client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepfos_agent_client"]
