function open(i){current=i;const x=items[i],cfg=saved.get(x.code);selectedId=cfg?.model_id||cfg?.agent_id||'';$('title').textContent=x.name;$('modalTitle').querySelector('svg')?.remove();$('modalTitle').insertAdjacentHTML('afterbegin',icon(x.icon));$('code').textContent=x.code;$('description').textContent=i===2?'为数据流节点中的代码、SQL 与配置辅助选择统一模型。':'选择组件助手关联的 Agent，模型、工具与指令沿用该 Agent 的配置。';$('modelLabel').textContent=i===2?'LLM 模型':'Agent';$('tempField').hidden=i!==2;$('modelHint').textContent=i===2?'服务地址和密钥沿用所选模型的 Provider 配置。':'选择已有 Agent，关联后由组件读取并使用。';$('temperature').value=$('range').value=cfg?.temperature??0;$('featureIntro').textContent=i===2?'以下功能共用所选模型，修改后统一生效。':'以下说明仅描述集成用途，实际能力以关联 Agent 的配置为准。';$('featureList').innerHTML=features[i].map(([ic,t,d])=>`<div class="feature">${icon(ic)}<div><strong>${t}</strong><p>${d}</p></div></div>`).join('');closeMenu();drawPicker();updateApi();selectTab('features');icons();$('modal').showModal()}
function selectTab(t){for(const n of ['features','api'])$(n).hidden=n!==t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));closeMenu()}
$('model').onclick=()=>{const show=$('modelMenu').hidden;$('modelMenu').hidden=!show;$('model').setAttribute('aria-expanded',String(show));if(show)$('modelMenu').querySelector('[aria-selected=true],button')?.focus()};
$('picker').addEventListener('keydown',e=>{const bs=[...$('modelMenu').querySelectorAll('button')];const index=bs.indexOf(document.activeElement);if(e.key==='Escape'&&!$('modelMenu').hidden){e.preventDefault();e.stopPropagation();closeMenu();$('model').focus()}if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();$('modelMenu').hidden=false;$('model').setAttribute('aria-expanded','true');bs[(index+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length]?.focus()}});
$('clear').onclick=()=>{selectedId='';closeMenu();drawPicker();updateApi()};$('defaultTemp').onclick=()=>{$('temperature').value=$('range').value=0;updateApi()};$('range').oninput=()=>{$('temperature').value=$('range').value;updateApi()};$('temperature').oninput=()=>{$('range').value=$('temperature').value;updateApi()};
