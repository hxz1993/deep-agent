<!doctype html>
<html lang="zh-CN">
<body>
  <main class="settings-card models-card">
    <div class="panel-toolbar models-toolbar catalog-header">
      <div>
        <h1 class="catalog-title">
          模型目录
          <span class="catalog-info" tabindex="0" aria-label="查看模型目录说明">
            <i data-lucide="info"></i>
            <span class="catalog-info-tooltip" role="tooltip">
              <strong>目录与运行配置的关系</strong>
              <span>仅展示 DeepAgent 已支持的供应商。</span>
              <span>更新失败时保留旧目录，不会修改已有模型配置。</span>
              <span>在模型配置中可从目录添加模型，或手工创建私有模型。</span>
            </span>
          </span>
        </h1>
        <p class="panel-subtitle settings-desc models-desc">
          选择供应商，浏览模型及其能力。目录来自 <strong>models.dev</strong>。
        </p>
      </div>
      <div class="models-toolbar-actions">
        <button type="button" class="btn" id="catalogExportBtn"><i data-lucide="download"></i>导出</button>
        <button type="button" class="btn" id="catalogImportBtn"><i data-lucide="upload"></i>导入</button>
        <input type="file" id="catalogImportInput" accept="application/json,.json" hidden />
        <button type="button" class="btn primary" id="catalogRefreshBtn"><i data-lucide="cloud-download"></i>在线更新</button>
      </div>
    </div>

    <div class="models-filters">
        <label class="field models-search-field" aria-label="搜索模型目录">
          <i data-lucide="search" aria-hidden="true"></i>
          <input type="search" id="catalogSearchInput" placeholder="搜索当前供应商的模型" autocomplete="off" />
        </label>
        <div class="field models-filter-field console-select" data-catalog-select="catalogModalitySelect">
          <button type="button" class="console-select-trigger" id="catalogModalitySelectTrigger" aria-label="筛选输入模态" aria-haspopup="listbox" aria-expanded="false" aria-controls="catalogModalitySelectMenu">
            <span id="catalogModalitySelectLabel">全部输入模态</span><i data-lucide="chevron-down" aria-hidden="true"></i>
          </button>
          <div class="console-select-menu hidden" id="catalogModalitySelectMenu" role="listbox" aria-label="筛选输入模态"></div>
          <select id="catalogModalitySelect" class="hidden" tabindex="-1" aria-hidden="true">
            <option value="">全部输入模态</option>
            <option value="text">文本</option>
            <option value="image">图像</option>
            <option value="audio">音频</option>
            <option value="video">视频</option>
          </select>
        </div>
    </div>

    <div class="catalog-feedback hidden" id="catalogFeedback" role="alert"></div>
    <p class="models-status" id="catalogStatusLine">加载中…</p>

    <div class="catalog-browser" id="catalogBrowser">
      <aside class="catalog-lab-sidebar" id="catalogSupplierSidebar" aria-label="供应商">
        <div class="catalog-lab-heading"><span>供应商</span></div>
      </aside>

      <section class="catalog-results">
        <h2 class="catalog-supplier-title" id="catalogSupplierTitle">模型</h2>
        <div class="table-wrap console-list-a models-table-wrap">
          <table class="data-table catalog-model-table" id="catalogModelsTable">
            <thead id="catalogTableHead"></thead>
            <tbody id="catalogTableBody">
              <tr><td colspan="5" class="empty-cell">加载中…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="catalog-empty hidden" id="catalogEmptyState">
          <strong>模型目录尚未更新</strong>
          <span>可以联网更新，也可以导入models.dev官方catalog.json后写入数据库。</span>
          <button type="button" class="btn primary" data-catalog-refresh><i data-lucide="cloud-download"></i>在线更新</button>
        </div>
      </section>
    </div>

    <div class="models-pagination" id="catalogPaginationBar">
      <button type="button" class="btn btn-sm" id="catalogPrevPageBtn" disabled>上一页</button>
      <span class="models-page-info" id="catalogPageInfo">—</span>
      <button type="button" class="btn btn-sm" id="catalogNextPageBtn" disabled>下一页</button>
    </div>

  </main>
</body>
</html>
