utton class="nav-button " type="button"><i data-lucide="list"></i><span>日志</span></button></nav><div class="prototype-nav-bottom"><button class="nav-button" id="themeToggle"><i data-lucide="sun-moon"></i><span>切换主题</span></button><button class="nav-button" id="resetDemo"><i data-lucide="rotate-ccw"></i><span>重置示例</span></button></div></aside><main id="page-configuration" class="page active"><div class="review-stamp">设计评审，未落地 · 示例数据</div><div id="configurationHost">    <!-- Skill panel -->
