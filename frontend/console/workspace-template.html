<!doctype html>
<html lang="zh-CN">
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-name">deep-agent</span>
        </div>
        <button class="icon-btn" id="newChatBtn" title="新建会话">＋</button>
      </div>

      <button type="button" class="new-chat" id="newChatBtnWide" aria-haspopup="menu" aria-expanded="false">
        <span class="new-chat-label">＋ 新建对话</span>
        <span class="new-chat-chevron" aria-hidden="true">▾</span>
      </button>

      <div class="sidebar-section">
        <div class="section-title">历史会话</div>
        <ul class="session-list" id="sessionList"></ul>
      </div>

      <div class="sidebar-section grow">
        <div class="section-title">
          能力 (capabilities)
          <button class="link-btn" id="refreshCapsBtn">刷新</button>
        </div>
        <ul class="cap-list" id="capList">
          <li class="cap-empty">未加载</li>
        </ul>
      </div>

    </aside>

    <!-- 主聊天区 -->
    <main class="chat">
      <header class="chat-header">
        <button class="icon-btn ghost" id="toggleSidebar" title="切换侧边栏">☰</button>
        <div class="chat-title">
          <span id="chatTitle">新对话</span>
          <span class="session-badge session-subtitle" id="sessionBadge"></span>
        </div>
        <div class="chat-actions">
          <span class="usage" id="usageInfo"></span>
          <button type="button" class="workspace-header-action" data-open-context title="测试Header" aria-label="测试Header">
            <i data-lucide="waypoints"></i><span>测试Header</span>
          </button>
          <button type="button" class="workspace-header-action active" id="toggleInspectorPaneBtn" title="隐藏会话详情" aria-label="显示或隐藏会话详情" aria-pressed="true">
            <i data-lucide="panel-right"></i><span>会话详情</span>
          </button>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <div class="empty-logo">🤖</div>
          <h1>deep-agent 对话</h1>
          <p>输入消息开始与智能体对话。支持工具调用的实时流式输出。</p>
          <div class="suggestions" id="suggestions">
            <button class="suggestion">现在几点了？</button>
            <button class="suggestion">帮我总结一下今天的待办</button>
            <button class="suggestion">用 Python 写一个快速排序</button>
          </div>
        </div>
      </div>

      <div class="composer">
        <div class="attachment-preview hidden" id="attachmentPreview"></div>
        <div class="composer-meta" id="composerMeta">
          <label class="composer-model-picker">
            <span class="composer-model-label">模型</span>
            <select id="modelSelect" class="composer-model-select" title="选择本会话使用的 LLM 模型"></select>
          </label>
          <span class="composer-modalities" id="composerModelModalities"></span>
          <span class="composer-modalities" id="composerUploadCapabilities"></span>
        </div>
        <div class="composer-inner">
          <button type="button" class="composer-icon-btn attach-btn" id="attachBtn" title="添加附件" aria-label="添加附件">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11.6 12 21a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
          </button>
          <button type="button" class="composer-icon-btn compact-context-btn" id="compactContextBtn" title="当前没有可压缩的会话历史" aria-label="压缩上下文" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v5H3M16 3v5h5M8 21v-5H3M16 21v-5h5"/><path d="m3 8 5-5m13 5-5-5M3 16l5 5m13-5-5 5"/></svg>
          </button>
          <input type="file" id="fileInput" class="hidden" multiple accept="image/*,.pdf,.docx,.xlsx,.txt,.csv,.json,.md,.html,.xml,.mp3,.wav,.mp4" />
          <textarea
            id="input"
            rows="1"
            placeholder="给 Agent 发送消息…（Enter 发送，Shift+Enter 换行）"
          ></textarea>
          <button type="button" class="context-budget-badge" id="contextBudgetBadge" title="历史上下文估算尚不可用" aria-label="历史上下文估算">上下文 —</button>
          <button class="send-btn" id="sendBtn" title="发送">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
          <button class="stop-btn hidden" id="stopBtn" title="停止生成">
            <span class="stop-square"></span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <div class="new-chat-menu hidden" id="newChatMenu" role="menu" aria-label="选择 Agent 新建对话"></div>

</body>
</html>
