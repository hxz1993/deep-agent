<!doctype html>
<html lang="zh-CN">
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-name">deep-agent</span>
        </div>
        <button class="icon-btn" id="newChatBtn" title="新建会话" aria-label="新建会话"><i data-lucide="message-circle-plus"></i></button>
      </div>

      <button type="button" class="new-chat" id="newChatBtnWide" aria-haspopup="menu" aria-expanded="false">
        <span class="new-chat-label"><i data-lucide="plus"></i>新建对话</span>
        <span class="new-chat-chevron" aria-hidden="true"><i data-lucide="chevron-down"></i></span>
      </button>

      <div class="sidebar-section">
        <div class="section-title">历史会话</div>
        <ul class="session-list" id="sessionList"></ul>
      </div>

      <div class="sidebar-section grow">
        <div class="section-title">
          能力 (capabilities)
          <button class="link-btn" id="refreshCapsBtn">刷新</button>
        </div>
        <ul class="cap-list" id="capList">
          <li class="cap-empty">未加载</li>
        </ul>
      </div>

    </aside>

    <!-- 主聊天区 -->
    <main class="chat">
      <header class="chat-header">
        <button class="icon-btn ghost" id="toggleSidebar" title="切换侧边栏" aria-label="切换侧边栏"><i data-lucide="panel-left"></i></button>
        <div class="chat-title">
          <span id="chatTitle">新对话</span>
          <span class="session-subtitle-row">
            <span class="session-badge session-subtitle" id="sessionBadge"></span>
            <button type="button" class="session-copy-btn" id="copySessionIdBtn" title="复制会话 ID" aria-label="复制会话 ID" hidden><i data-lucide="copy"></i></button>
          </span>
        </div>
        <button type="button" class="workspace-header-action workspace-test-app" data-open-context title="调试" aria-label="调试" aria-haspopup="dialog">
          <i data-lucide="sliders-horizontal"></i><span class="workspace-test-app-label">调试</span><span class="workspace-test-app-id" data-test-app-id>不分应用</span>
        </button>
        <div class="chat-actions">
          <nav class="chat-view-tabs" id="chatViewTabs" role="tablist" aria-label="会话视图">
            <button type="button" class="chat-view-tab active" id="conversationViewTab" role="tab" aria-selected="true" aria-controls="messages" data-chat-view="conversation">对话</button>
            <button type="button" class="chat-view-tab" id="trajectoryViewTab" role="tab" aria-selected="false" aria-controls="trajectoryView" data-chat-view="trajectory">轨迹</button>
          </nav>
          <button type="button" class="workspace-header-action active" id="toggleInspectorPaneBtn" title="隐藏详情" aria-label="显示或隐藏详情" aria-pressed="true">
            <i data-lucide="panel-right"></i>
          </button>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <div class="empty-heading">
            <img class="empty-logo" src="./favicon.svg?v=20260922-d-rounded" alt="" />
            <h1 id="emptyAgentName">请选择 Agent</h1>
          </div>
          <p class="empty-context" aria-live="polite"><span data-empty-context-prefix>当前</span><button type="button" class="empty-context-link" data-open-context aria-haspopup="dialog"><span data-empty-context-label>不分应用</span></button><span data-empty-context-note>，无法调用 DeepFOS MCP 及相关平台工具。</span></p>
        </div>
      </div>

      <section class="trajectory-view hidden" id="trajectoryView" role="tabpanel" aria-labelledby="trajectoryViewTab">
        <header class="trajectory-toolbar">
          <div class="trajectory-modes" role="group" aria-label="轨迹筛选">
            <button type="button" class="active" data-trajectory-mode="sequence"><i data-lucide="clock-3"></i><span>顺序</span></button>
            <button type="button" data-trajectory-mode="calls"><i data-lucide="wrench"></i><span>调用</span><small id="trajectoryCallCount">0</small></button>
          </div>
          <div class="trajectory-actions">
            <label class="trajectory-search"><i data-lucide="search"></i><input type="search" id="trajectorySearch" placeholder="搜索轨迹" /></label>
            <button type="button" class="trajectory-export" id="exportTrajectoryBtn" title="导出当前会话的安全轨迹 JSON"><i data-lucide="download"></i><span>导出轨迹</span></button>
          </div>
        </header>
        <div class="trajectory-layout">
          <div class="trajectory-list" id="trajectoryList">
            <div class="trajectory-empty"><i data-lucide="route"></i><p>当前会话还没有可展示的轨迹。</p></div>
          </div>
        </div>
      </section>

      <div class="composer">
        <section class="composer-plan hidden open" id="composerPlan" aria-live="polite">
          <button type="button" class="composer-plan-summary" id="composerPlanSummary" aria-expanded="true">
            <span class="composer-plan-chevron"><i data-lucide="chevron-right" aria-hidden="true"></i></span>
            <span class="composer-plan-icon"><i data-lucide="list-checks" aria-hidden="true"></i></span>
            <span class="composer-plan-title">任务计划</span>
            <span class="composer-plan-progress" id="composerPlanProgress"></span>
          </button>
          <ol class="composer-plan-items" id="composerPlanItems"></ol>
        </section>
        <div class="composer-inner" id="composerDropZone">
          <div class="composer-drop-overlay" id="composerDropOverlay" aria-hidden="true">
            <i data-lucide="file-up" aria-hidden="true"></i><span>松开添加附件</span>
          </div>
          <div class="attachment-preview hidden" id="attachmentPreview"></div>
          <input type="file" id="fileInput" class="hidden" multiple accept="image/*,.docx,.xlsx,.txt,.log,.csv,.json,.md,.html,.xml,.mp3,.wav,.mp4" />
          <div class="composer-input-row">
            <textarea
              id="input"
              rows="2"
              placeholder="给 Agent 发送消息…（Enter 发送，Shift+Enter 换行）"
            ></textarea>
          </div>
          <div class="composer-toolbar">
            <div class="composer-toolbar-start">
              <span class="attachment-control">
                <button type="button" class="composer-icon-btn attach-btn" id="attachBtn" aria-label="添加附件">
                  <i data-lucide="paperclip" aria-hidden="true"></i>
                </button>
                <span class="composer-tooltip attachment-tooltip" id="attachmentTooltip" role="tooltip">添加附件</span>
              </span>
            </div>
            <div class="composer-toolbar-end">
              <span class="context-budget-wrap">
                <button type="button" class="context-budget-badge" id="contextBudgetBadge" aria-label="上下文用量暂不可用"></button>
                <span class="composer-tooltip context-budget-tooltip" id="contextBudgetTooltip" role="tooltip">
                  <span class="context-budget-tooltip-title">上下文预算</span>
                  <span class="context-budget-tooltip-percent">用量暂不可用</span>
                  <span class="context-budget-tooltip-totals" hidden></span>
                </span>
              </span>
              <div class="composer-model-picker" id="composerMeta">
                <select id="modelSelect" class="composer-model-select" aria-hidden="true" tabindex="-1"></select>
                <button type="button" class="composer-model-trigger" id="composerModelTrigger" aria-haspopup="listbox" aria-expanded="false" title="选择模型">
                  <span class="composer-provider-icon"><i data-lucide="sliders-horizontal" aria-hidden="true"></i></span>
                  <span class="composer-model-trigger-label">模型</span>
                  <i class="composer-model-chevron" data-lucide="chevron-up" aria-hidden="true"></i>
                </button>
                <div class="composer-model-menu hidden" id="composerModelMenu" role="listbox" aria-label="选择本会话模型"></div>
              </div>
              <button class="send-btn" id="sendBtn" title="发送" aria-label="发送">
                <i data-lucide="send" aria-hidden="true"></i>
              </button>
              <button class="stop-btn hidden" id="stopBtn" title="停止生成" aria-label="停止生成">
                <span class="stop-square"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <dialog class="attachment-image-dialog" id="attachmentImageDialog" aria-labelledby="attachmentImageDialogName">
      <div class="attachment-image-dialog-content">
        <button type="button" class="attachment-image-dialog-close" id="attachmentImageDialogClose" aria-label="关闭图片预览">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
        <button type="button" class="attachment-image-dialog-nav previous" id="attachmentImageDialogPrevious" aria-label="上一张图片" hidden><i data-lucide="chevron-left" aria-hidden="true"></i></button>
        <button type="button" class="attachment-image-dialog-nav next" id="attachmentImageDialogNext" aria-label="下一张图片" hidden><i data-lucide="chevron-right" aria-hidden="true"></i></button>
        <img id="attachmentImageDialogImage" alt="附件图片预览" />
        <p id="attachmentImageDialogName" aria-live="polite"></p>
      </div>
    </dialog>
  </div>

  <div class="new-chat-menu hidden" id="newChatMenu" role="menu" aria-label="选择 Agent 新建对话"></div>

</body>
</html>
