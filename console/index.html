      <section class="console-page" id="page-diagnostics" data-page-panel="diagnostics">

          <header class="diagnostics-head diagnostics-log-header">
            <div class="diagnostics-log-heading"><h1>日志</h1><p id="diagnosticsInstance">查看会话执行过程，排查运行问题。</p></div>
          <form class="diagnostics-filters" id="diagnosticsFilters" autocomplete="off">
            <div class="diagnostics-primary-row">
            <div data-diagnostic-select="period"></div>
            <div data-diagnostic-select="source"></div>
            <div data-diagnostic-select="level"></div>
              <label class="compact-search diagnostics-keyword diagnostics-session-search"><i data-lucide="messages-square" aria-hidden="true"></i><input type="text" id="diagnosticsSession" placeholder="会话 ID" aria-label="会话 ID" maxlength="128" spellcheck="false" /></label>
            </div>
            <div class="diagnostics-search-row">
              <label class="compact-search diagnostics-keyword"><i data-lucide="search" aria-hidden="true"></i><input autocomplete="off" type="search" id="diagnosticsKeyword" placeholder="搜索日志内容" aria-label="搜索日志内容" maxlength="200" /></label>
            <div class="agent-view-switch diagnostics-view-switch" role="group" aria-label="日志视图"><button type="button" id="diagnosticsListView" class="active" aria-pressed="true" aria-label="列表" title="列表"><i data-lucide="list" aria-hidden="true"></i></button><button type="button" id="diagnosticsRawView" aria-pressed="false" aria-label="原始" title="原始"><i data-lucide="file-text" aria-hidden="true"></i></button></div>
            <button type="button" class="diagnostics-button" id="diagnosticsExport"><i data-lucide="download" aria-hidden="true"></i><span>导出</span></button>
            <button type="submit" class="diagnostics-button primary" id="diagnosticsQuery"><i data-lucide="search" aria-hidden="true"></i><span>查询</span></button>
            <button type="button" class="diagnostics-button text" id="diagnosticsReset" title="清空条件">重置</button>
            </div>
                <div class="diagnostics-custom-time hidden" id="diagnosticsCustomTime"><input type="datetime-local" id="diagnosticsStart" aria-label="开始时间（本地时区）" title="开始时间（本地时区）"/><span>至</span><input type="datetime-local" id="diagnosticsEnd" aria-label="结束时间（本地时区）" title="结束时间（本地时区）"/></div>
          </form>
          </header>
          <button type="button" class="diagnostics-button hidden" id="diagnosticsBack"><i data-lucide="arrow-left" aria-hidden="true"></i>返回</button>
          <div class="diagnostics-notice hidden" id="diagnosticsNotice" role="status" aria-live="polite"></div>
        <dialog class="modal" id="diagnosticsExportDialog" aria-labelledby="diagnosticsExportTitle">
          <div class="modal-header"><h3 id="diagnosticsExportTitle">导出日志</h3><button type="button" class="icon-action" id="diagnosticsExportClose" aria-label="关闭"><i data-lucide="x"></i></button></div>
          <div class="modal-body">
            <p id="diagnosticsExportRange"></p>
            <p id="diagnosticsExportFilters"></p>
            <p id="diagnosticsExportStatus" role="status" aria-live="polite">正在统计匹配日志…</p>
            <p class="field-hint">按当前查询条件导出原始文本，最多 5,000 条、10 MB，最多读取 60 秒。若有截断，将在导出前提示。</p>
          </div>
          <div class="modal-footer"><button type="button" class="btn" id="diagnosticsExportCancel">取消</button><button type="button" class="btn primary" id="diagnosticsExportConfirm" disabled>导出日志</button></div>
        </dialog>
          <div class="diagnostics-split" id="diagnosticsSplit">
          <div class="diagnostics-log-workspace">
          <div class="diagnostics-result-head"><div class="diagnostics-result-title"><span id="diagnosticsQueryRange"></span><span id="diagnosticsRangeSeparator" aria-hidden="true" hidden>·</span><span id="diagnosticsMeta" aria-live="polite">尚未查询</span><span id="diagnosticsPartial" class="hidden"></span><button type="button" class="diagnostics-button text hidden" id="diagnosticsMore">加载更多</button></div><span id="diagnosticsCopyStatus" role="status" aria-live="polite"></span></div>
          <div class="diagnostics-log-view" id="diagnosticsListPane" tabindex="0" aria-label="诊断日志列表">
            <div id="diagnosticsRecords"></div>
            <div class="diagnostics-empty" id="diagnosticsEmpty">正在准备日志查询…</div>
          </div>
          </div>
          <div id="diagnosticsRawPane" class="diagnostics-raw-pane" hidden><span id="diagnosticsRawStatus" role="status" aria-live="polite"></span><textarea id="diagnosticsRawText" aria-label="原始日志" readonly wrap="off" spellcheck="false"></textarea></div>

          <aside class="diagnostics-drawer" id="diagnosticsDrawer" aria-label="日志详情"></aside>

        <div id="diagnosticsUsagePage" class="diagnostics-page hidden"></div>
