<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepAgent 回复产物卡片</title>
  <style>
    :root {
      color-scheme: light;
      --text: #222937; --muted: #606b7b; --border: #d7dee8; --canvas: #f4f6f9;
      --surface: #fff; --accent: #5145dc; --hover: #f3f3fd; --line: #e6eaf0;
      font: 15px/1.5 "Segoe UI", system-ui, -apple-system, "PingFang SC", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--surface); }
    main { max-inline-size: 820px; margin: auto; padding: 26px 24px 42px; }
    main > p { margin: 0 0 14px; }
    .files {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
    }
    .file {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center; gap: 10px; min-height: 64px; min-width: 0;
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
      background: var(--surface);
    }
    .file:focus-within, .file:hover { border-color: #a8a9de; }
    .file-type {
      display: grid; place-items: center; width: 42px; height: 42px;
      border-radius: 7px; background: #eeedfc; color: #5145ae; font-size: 11px; font-weight: 700;
    }
    .file-type[data-kind="csv"] { background: #edf6f0; color: #216343; }
    .file-copy { display: grid; gap: 2px; min-width: 0; }
    .filename { overflow-wrap: anywhere; font-weight: 620; font-size: 13px; }
    .file-size { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .file-actions { display: flex; gap: 5px; align-items: center; }
    button, a { color: var(--accent); }
    button {
      min-height: 30px; white-space: nowrap; border: 1px solid transparent; border-radius: 6px;
      background: transparent; padding: 3px 8px; font: inherit; font-size: 13px; cursor: pointer;
    }
    button:hover, button:focus-visible { background: var(--hover); }
    .open { border-color: var(--border); color: var(--text); background: var(--surface); }
    .mini-chart { padding: 9px 9px 8px; border: 1px solid var(--line); border-radius: 6px; background: #f8f9fc; }
    .mini-chart > div { display: flex; gap: 9px; align-items: center; margin: 3px 0; }
    .mini-chart .label { flex: 0 0 4.2em; font-size: 11px; color: var(--muted); }
    .mini-chart .bar { width: var(--value); height: 7px; border-radius: 2px; background: #776ee4; }
    .mini-chart strong { font: 11px ui-monospace, monospace; }
    dialog {
      color: var(--text); background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 17px 19px; width: min(420px, calc(100% - 28px));
    }
    dialog::backdrop { background: #222b4048; }
    dialog header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    dialog pre { background: var(--canvas); padding: 12px; border-radius: 6px; overflow: auto; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 660px) {
      main { padding: 18px 12px; }
      .files { grid-template-columns: 1fr; }
    }
    @media (max-width: 380px) {
      .file { gap: 8px; padding-inline: 9px; }
      .file-actions { gap: 2px; }
      .file-actions button { padding-inline: 6px; }
    }
  </style>
</head>
<body>
  <main>
    <p>已完成覆盖分析。两组叶级成员数分别是 23 和 759，差额为 736。可打开报告查看口径，也可以下载明细复核。</p>
    <div id="files" class="files"></div>
  </main>
  <dialog id="viewer" aria-labelledby="preview-title">
    <header>
      <strong id="preview-title"></strong>
      <form method="dialog"><button>关闭</button></form>
    </header>
    <div id="preview"></div>
  </dialog>
  <script>
    const chart = '<div class="mini-chart" role="img" aria-label="两组叶级成员数量分别是 23 和 759">'
      + '<div><span class="label">较小成员</span><span class="bar" style="--value:2%"></span><strong>23</strong></div>'
      + '<div><span class="label">较大成员</span><span class="bar" style="--value:66%"></span><strong>759</strong></div></div>';
    const csv = "成员,叶级成员数\n较小成员,23\n较大成员,759\n";
    const report = '<meta charset="utf-8"><title>酒店组织覆盖报告</title>'
      + '<h1>组织覆盖报告</h1><p>两组分别是 23 和 759，差额 736。</p>'
      + '<p>口径为同一快照的叶级组织成员数。</p>' + chart;
    const files = [
      { key: "report", name: "酒店组织覆盖报告.html", type: "HTML",
        blob: new Blob([report], { type: "text/html" }) },
      { key: "csv", name: "酒店组织覆盖明细.csv", type: "CSV",
        blob: new Blob(["\ufeff", csv], { type: "text/csv" }) },
    ];
    const list = document.querySelector("#files");
    list.innerHTML = files.map(file => `<article class="file">
      <div class="file-type" data-kind="${file.key}" aria-hidden="true">${file.type}</div>
      <div class="file-copy">
        <span class="filename">${file.name}</span>
        <span class="file-size">${file.blob.size} B</span>
      </div>
      <div class="file-actions">
        <button class="open" type="button" data-open="${file.key}" aria-label="预览 ${file.name}">预览</button>
        <button type="button" data-download="${file.key}" aria-label="下载示例 ${file.name}">下载</button>
      </div>
    </article>`).join("");

    const viewer = document.querySelector("#viewer");
    list.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;
      const file = files.find(item => item.key === (button.dataset.open || button.dataset.download));
      if (button.dataset.open) {
        document.querySelector("#preview-title").textContent = file.name;
        const preview = document.querySelector("#preview");
        if (file.key === "csv") {
          const pre = document.createElement("pre");
          pre.textContent = csv;
          preview.replaceChildren(pre);
        } else {
          preview.innerHTML = "<p>组织维度叶级成员数</p>" + chart;
        }
        viewer.showModal();
        return;
      }
      const item = document.createElement("a");
      item.href = URL.createObjectURL(file.blob);
      item.download = file.name;
      item.click();
      setTimeout(() => URL.revokeObjectURL(item.href), 1000);
    });
  </script>
</body>
</html>
