const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)],fmt=n=>Math.round(n).toLocaleString('en-US'),short=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1000?(n/1000).toFixed(n>=100000?0:1)+'K':fmt(n),pct=(n,d)=>d?(n/d*100).toFixed(1)+'%':'—';
const COLORS=['#4f46e5','#8b7bef','#b8acf7','#ddd6fb'];
const USERS=['张宁','李敏','王宇','陈悦','赵明','系统用户'],AGENTS=['智能问数','文档助手','通用助手'];
const MODELS=[{id:'mdl_ds',name:'deepseek-flash',provider:'DeepSeek'},{id:'mdl_gpt',name:'gpt-5.4',provider:'OpenAI'},{id:'mdl_qwen',name:'qwen-plus',provider:'阿里云'},{id:'mdl_7f3a',name:'旧模型',provider:'历史 Provider',deleted:true}];
const PURPOSES=['聊天','标题','压缩'];
const state={layout:'a',days:7,user:'all',agent:'all',model:'all',metric:'total',group:'agent',chart:'bar',requests:true,hidden:new Set(),table:'user',sort:'total',descending:true,query:'',selection:null};
const DATA=[];for(let day=0;day<30;day++){const date=new Date(Date.UTC(2026,7,25+day)).toISOString().slice(0,10);for(let u=0;u<6;u++){const count=Math.max(1,Math.round((6-u)*((day*7%11)+4)/4));for(let r=0;r<count;r++){const a=(r+u+day)%3,m=(r*3+u+day)%14<8?0:(r+u+day)%3+1,p=r%11===0?2:r%5===0?1:0;const input=p===1?350+(day*31+r*13)%750:p===2?12500+(day*119+r*677)%13500:1400+(day*521+r*859+u*235)%6500;const output=p===1?25+(r+day)%35:p===2?1000+(day*17+r*59)%800:100+(day*59+r*101)%950;DATA.push({id:`${day}-${u}-${r}`,date,user:USERS[u],agent:AGENTS[a],model:MODELS[m].id,purpose:PURPOSES[p],input,output,total:input+output,requests:1,cache:Math.floor(input*((day+r)%7)/9)});}}}

$('#navigation').innerHTML=[['test','测试'],['agent','Agent'],['integration','集成'],['signal','渠道'],[null,'设置'],['model','模型'],['tool','工具'],['plug','MCP'],['book','Skill'],[null,'诊断'],['list','日志'],['chat','会话'],['chart','用量']].map(([i,t])=>i?`<div class="nav ${t==='用量'?'active':''}">${icon(i)}<span>${t}</span></div>`:`<div class="section-label">${t}</div>`).join('');all('[data-icon]').forEach(e=>e.insertAdjacentHTML('afterbegin',icon(e.dataset.icon)));
const rangeStart=()=>new Date(Date.UTC(2026,8,24-state.days)).toISOString().slice(0,10);
function filtered(){return DATA.filter(r=>r.date>=rangeStart()&&(state.user==='all'||r.user===state.user)&&(state.agent==='all'||r.agent===state.agent)&&(state.model==='all'||r.model===state.model));}
function sum(rows){return rows.reduce((a,r)=>{for(const k of ['input','output','total','requests','cache'])a[k]+=r[k];return a;},{input:0,output:0,total:0,requests:0,cache:0});}
function groups(rows,dim){const map=new Map();for(const r of rows){const key=r[dim];if(!map.has(key))map.set(key,{key,rows:[]});map.get(key).rows.push(r);}return [...map.values()].map(g=>({...g,...sum(g.rows)})).sort((a,b)=>b.total-a.total);}
function nameFor(key,dim){if(dim==='model'){const m=MODELS.find(m=>m.id===key);if(!m)return key;return m.deleted?'已删除 · '+m.name:m.name;}return key;}
function summary(rows){const t=sum(rows);return `<section class="summary" aria-label="筛选范围汇总">${[['累计 Token','total','Token'],['输入','input','Token'],['输出','output','Token'],['模型请求','requests','次']].map(([label,key,unit])=>`<div class="stat"><div class="stat-label">${label}</div><div class="stat-value" data-stat="${key}">${fmt(t[key])}<small>${unit}</small></div></div>`).join('')}</section>`;}
function option(values,selected){return values.map(([v,t])=>`<option value="${v}" ${v===selected?'selected':''}>${t}</option>`).join('');}
function trendCard(title='用量趋势'){return `<section class="surface trend"><div class="surface-head"><div><h2>${title}</h2><div class="sub">按日查看 Token 与模型请求次数</div></div><div class="tools"><select id="metric" aria-label="趋势指标">${option([['total','总 Token'],['input','输入 Token'],['output','输出 Token']],state.metric)}</select><select id="group" aria-label="趋势分组">${option([['agent','按 Agent'],['purpose','按用途'],['model','按模型 · Top3'],['user','按用户 · Top3']],state.group)}</select><div class="seg" aria-label="图形"><button data-chart="bar" aria-pressed="${state.chart==='bar'}">柱形</button><button data-chart="line" aria-pressed="${state.chart==='line'}">折线</button></div></div></div><div class="chart-content"><div class="axis-note"><span id="axisLabel">Token · 左轴</span><span id="rightAxisLabel">请求次数 · 右轴</span></div><svg id="trendSvg" class="chart-canvas" role="img" aria-label="每日 Token 与请求次数双轴图"></svg></div><div class="legend" id="legend"></div><label class="req-toggle"><input id="requestsToggle" type="checkbox" ${state.requests?'checked':''}>叠加请求次数 <span style="margin-left:6px;color:var(--ink)">┄┄</span><span>右轴 / 全部分组</span></label></section>`;}
function distribution(rows,compact=false){const total=sum(rows).total,gs=groups(rows,'purpose');return `<section class="surface"><div class="surface-head"><div><h2>用途分布</h2><div class="sub">同一时间范围 · 按 Token</div></div><span class="small muted">${gs.length} 类</span></div><div class="distribution"><div class="stack-bar" aria-label="用途占比">${gs.map((g,i)=>`<i title="${g.key} ${pct(g.total,total)}" style="--c:${COLORS[i]};width:${total?g.total/total*100:0}%"></i>`).join('')}</div>${gs.map((g,i)=>`<div class="dist-row"><i class="bullet" style="--c:${COLORS[i]}"></i><span>${g.key}</span><span class="num">${short(g.total)}</span><span class="pct">${pct(g.total,total)}</span></div>`).join('')||'<div class="empty">暂无数据</div>'}${compact?'':`<div class="dist-rule"></div><h3>用户用量 <span class="muted small">Top 3 + 其他</span></h3>${rankRows(rows)}`}</div></section>`;}
function rankRows(rows){const gs=groups(rows,'user'),show=gs.slice(0,3);if(gs.length>3)show.push({key:'其他',total:gs.slice(3).reduce((a,b)=>a+b.total,0)});const max=Math.max(1,...show.map(g=>g.total));return show.map((g,i)=>`<div class="rank-row"><span>${g.key}</span><span class="track"><i style="--c:${COLORS[i]};width:${g.total/max*100}%"></i></span><span class="num">${short(g.total)}</span></div>`).join('');}
function tableCard(){return `<section class="surface main-table"><div class="surface-head table-head"><div><h2>用量明细</h2><div class="sub">${state.layout==='c'?'选择一行，右侧联动查看趋势与构成':'按人、模型或 Agent 汇总，点击查看详情'}</div></div><div class="tools"><input class="search" id="tableSearch" placeholder="搜索明细" aria-label="搜索明细" value="${state.query.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}"><button class="text-btn small" id="exportButton">${icon('download')}导出</button></div></div><div class="tabs" aria-label="明细维度">${[['user','用户'],['model','模型'],['agent','Agent'],['purpose','用途'],['date','日期']].map(([v,t])=>`<button data-table="${v}" aria-pressed="${state.table===v}">${t}</button>`).join('')}</div><div class="table-wrap" id="tableBody"></div><div class="table-footer"><span id="tableCount"></span><span>实际已报告用量</span></div></section>`;}
let chartRows=[],chartInfo=null,pinned=false;
function selectedRows(rows){return state.selection?rows.filter(r=>r[state.table]===state.selection):rows;}
function render(){hideTip();const rows=filtered();$('#dateLabel').textContent=rangeStart().replaceAll('-','/')+' — 2026/09/23';$('#content').className='layout-'+state.layout;all('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===state.layout)));all('[data-days]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.days)===state.days)));const head=summary(rows);if(state.layout==='a')$('#content').innerHTML=head+trendCard()+`<div class="lower">${distribution(rows)}${tableCard()}</div>`;else if(state.layout==='b')$('#content').innerHTML=head+`<div class="overview-grid">${trendCard()}${distribution(rows)}</div>`+tableCard();else $('#content').innerHTML=head+`<div class="workbench">${tableCard()}<div class="detail-side"><div class="scope-title"><strong>${state.selection?nameFor(state.selection,state.table):'全部用量'}</strong><span class="badge">${state.selection?'当前选择':'全局'}</span>${state.selection?'<button class="text-btn small" id="clearSelection">取消选择</button>':''}</div>${trendCard('日期趋势')}${distribution(selectedRows(rows),true)}</div></div>`;
chartRows=state.layout==='c'?selectedRows(rows):rows;renderTable();renderChart();$('#metric').onchange=e=>{state.metric=e.target.value;renderChart();};$('#group').onchange=e=>{state.group=e.target.value;state.hidden.clear();renderChart();};all('[data-chart]').forEach(b=>b.onclick=()=>{state.chart=b.dataset.chart;all('[data-chart]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.chart===state.chart)));renderChart();});$('#requestsToggle').onchange=e=>{state.requests=e.target.checked;renderChart();};all('[data-table]').forEach(b=>b.onclick=()=>{state.table=b.dataset.table;state.selection=null;state.query='';state.sort='total';state.descending=true;render();});$('#tableSearch').oninput=e=>{state.query=e.target.value;renderTable();};$('#exportButton').onclick=exportTable;if($('#clearSelection'))$('#clearSelection').onclick=()=>{state.selection=null;render();};}
function currentTable(){return groups(filtered(),state.table).filter(g=>(nameFor(g.key,state.table)+' '+g.key+(state.table==='model'?MODELS.find(m=>m.id===g.key).provider:'')).toLowerCase().includes(state.query.toLowerCase())).sort((a,b)=>{const d=state.sort==='key'?nameFor(a.key,state.table).localeCompare(nameFor(b.key,state.table),'zh'):a[state.sort]-b[state.sort];return state.descending?-d:d;});}
function renderTable(){const rows=currentTable(),total=sum(filtered()).total;$('#tableBody').innerHTML=`<table class="usage-table"><thead><tr>${[['key',{user:'用户',model:'模型',agent:'Agent',purpose:'用途',date:'日期'}[state.table]],['requests','请求'],['input','输入'],['output','输出'],['total','总 Token']].map(([k,t])=>`<th aria-sort="${state.sort===k?(state.descending?'descending':'ascending'):'none'}"><button data-sort="${k}">${t} ${state.sort===k?(state.descending?'↓':'↑'):'↕'}</button></th>`).join('')}</tr></thead><tbody>${rows.map(g=>{const model=state.table==='model'?MODELS.find(m=>m.id===g.key):null;return `<tr data-row="${g.key}" tabindex="0" aria-label="查看 ${nameFor(g.key,state.table)} 的用量" class="${state.selection===g.key?'selected':''}"><td><div class="cell-main">${state.table==='user'?`<span class="avatar">${g.key.slice(0,1)}</span>`:''}<span>${nameFor(g.key,state.table)}</span></div>${model?`<span class="cell-sub">${model.provider}${model.deleted?' · '+model.id:''}</span>`:`<div class="cell-bar"><i style="width:${total?g.total/total*100:0}%"></i></div>`}</td><td>${fmt(g.requests)}</td><td>${fmt(g.input)}</td><td>${fmt(g.output)}</td><td><strong style="font-weight:570">${fmt(g.total)}</strong></td></tr>`;}).join('')||'<tr><td colspan="5"><div class="empty">没有匹配的记录</div></td></tr>'}</tbody><tfoot><tr><td>合计</td>${['requests','input','output','total'].map(k=>`<td>${fmt(rows.reduce((a,r)=>a+r[k],0))}</td>`).join('')}</tr></tfoot></table>`;$('#tableCount').textContent=`${rows.length} 项${state.query?' · 搜索结果':''}`;all('[data-sort]').forEach(b=>b.onclick=()=>{if(state.sort===b.dataset.sort)state.descending=!state.descending;else{state.sort=b.dataset.sort;state.descending=true;}renderTable();});all('[data-row]').forEach(tr=>{const go=()=>{if(state.layout==='c'){state.selection=tr.dataset.row;render();}else showDetails(tr.dataset.row);};tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});}
function niceMax(v){if(!v)return 4;const rough=v/4,p=10**Math.floor(Math.log10(rough)),unit=Math.ceil(rough/p)*p;return unit*4;}
function seriesData(){const ranked=groups(chartRows,state.group),top=ranked.slice(0,3),keys=top.map(g=>g.key);if(ranked.length>3)top.push({key:'其他',total:ranked.slice(3).reduce((a,g)=>a+g.total,0)});const dates=Array.from({length:state.days},(_,i)=>new Date(Date.UTC(2026,8,24-state.days+i)).toISOString().slice(0,10));const daily=dates.map(date=>{const rows=chartRows.filter(r=>r.date===date);return {date,requests:rows.length,values:top.map(g=>sum(rows.filter(r=>g.key==='其他'?!keys.includes(r[state.group]):r[state.group]===g.key))[state.metric])};});return {series:top,daily};}
function renderChart(){hideTip();const svg=$('#trendSvg');if(!svg)return;const {series,daily}=seriesData(),W=Math.max(400,Math.round(svg.getBoundingClientRect().width)),H=Math.round(svg.getBoundingClientRect().height)||232,L=48,R=46,T=15,B=32,pw=W-L-R,ph=H-T-B,step=pw/state.days;const tokenMax=niceMax(Math.max(0,...daily.map(d=>d.values.reduce((a,b)=>a+b,0)))),reqMax=niceMax(Math.max(0,...daily.map(d=>d.requests)));const x=i=>L+step*(i+.5),y=v=>T+ph-v/tokenMax*ph,yr=v=>T+ph-v/reqMax*ph;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);$('#axisLabel').textContent={total:'总 Token',input:'输入 Token',output:'输出 Token'}[state.metric]+' · 左轴';$('#rightAxisLabel').textContent=state.requests?'请求次数 · 右轴':'';let parts=[];for(let t=0;t<=4;t++){const yy=T+ph-t*ph/4;parts.push(`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#ececf2"/><text x="${L-10}" y="${yy+3}" text-anchor="end">${short(tokenMax*t/4)}</text>${state.requests?`<text x="${W-R+10}" y="${yy+3}">${fmt(reqMax*t/4)}</text>`:''}`);}if(state.chart==='bar'){daily.forEach((d,i)=>{let accum=0;d.values.forEach((v,j)=>{if(state.hidden.has(series[j].key))return;const h=v/tokenMax*ph,bw=Math.min(34,step*.5);parts.push(`<rect x="${x(i)-bw/2}" y="${y(accum+v)}" width="${bw}" height="${h}" fill="${COLORS[j]}" rx="1.5"/>`);accum+=v;});});}else{series.forEach((s,j)=>{if(state.hidden.has(s.key))return;parts.push(`<polyline points="${daily.map((d,i)=>`${x(i)},${y(d.values[j])}`).join(' ')}" fill="none" stroke="${COLORS[j]}" stroke-width="2.2" stroke-linejoin="round"/>`);});}if(state.requests){parts.push(`<polyline points="${daily.map((d,i)=>`${x(i)},${yr(d.requests)}`).join(' ')}" fill="none" stroke="#352861" stroke-width="1.7" stroke-dasharray="4 4" stroke-linejoin="round"/>`);if(state.days<=7)daily.forEach((d,i)=>parts.push(`<circle cx="${x(i)}" cy="${yr(d.requests)}" r="2.7" fill="white" stroke="#352861" stroke-width="1.5"/>`));}daily.forEach((d,i)=>{const skip=state.days>7?Math.ceil(state.days/7):1;if(i%skip===0||i===state.days-1)parts.push(`<text x="${x(i)}" y="${H-9}" text-anchor="middle">${d.date.slice(5).replace('-','/')}</text>`);parts.push(`<g class="chart-hit" data-day="${i}" tabindex="0" role="button" aria-label="${d.date}，Token ${fmt(d.values.reduce((a,b)=>a+b,0))}，请求 ${d.requests} 次"><rect x="${L+step*i}" y="${T}" width="${step}" height="${ph}" fill="transparent"/></g>`);});svg.innerHTML=parts.join('');const visibleTotal=series.reduce((a,s)=>a+s.total,0);$('#legend').innerHTML=series.map((s,i)=>{const n=daily.reduce((a,d)=>a+d.values[i],0),den=daily.reduce((a,d)=>a+d.values.reduce((a,b)=>a+b,0),0);return `<button data-series="${s.key}" aria-pressed="${!state.hidden.has(s.key)}" title="显示/隐藏图表中的 ${nameFor(s.key,state.group)}，不影响汇总与表格"><i class="swatch" style="--c:${COLORS[i]}"></i><span><span class="legend-name">${s.key==='其他'?'其他':nameFor(s.key,state.group)}</span><span class="legend-value">${pct(n,den)}<small>${short(n)}</small></span></span></button>`;}).join('')||'<span class="muted small">此范围内没有已报告用量</span>';chartInfo={series,daily};all('[data-series]').forEach(b=>b.onclick=()=>{state.hidden.has(b.dataset.series)?state.hidden.delete(b.dataset.series):state.hidden.add(b.dataset.series);renderChart();});all('[data-day]').forEach(g=>{g.onpointermove=e=>{if(!pinned)showTip(Number(g.dataset.day),e.clientX,e.clientY);};g.onpointerleave=()=>{if(!pinned)$('#tip').style.display='none';};g.onclick=e=>{pinned=true;showTip(Number(g.dataset.day),e.clientX,e.clientY);};g.onfocus=()=>{const r=g.getBoundingClientRect();showTip(Number(g.dataset.day),r.x+r.width/2,r.y+45);};g.onblur=()=>{if(!pinned)$('#tip').style.display='none';};g.onkeydown=e=>{if(e.key==='Escape')hideTip();};});}
function showTip(i,x,y){const d=chartInfo.daily[i];$('#tip').innerHTML=`<strong>${d.date}</strong>${chartInfo.series.map((s,j)=>`<div class="tip-row"><span><i style="--c:${COLORS[j]}"></i>${s.key==='其他'?'其他':nameFor(s.key,state.group)}</span><b>${fmt(d.values[j])}</b></div>`).join('')}<div class="tip-row" style="border-top:1px solid var(--line);margin-top:5px;padding-top:4px"><span>${{total:'总 Token',input:'输入 Token',output:'输出 Token'}[state.metric]}</span><b>${fmt(d.values.reduce((a,b)=>a+b,0))}</b></div><div class="tip-row"><span>模型请求</span><b>${d.requests} 次</b></div><small>${pinned?'已固定 · 按 Esc 关闭':'点击固定 · 数值包含隐藏分组'}</small>`;const tip=$('#tip');tip.style.display='block';tip.style.left=Math.min(window.innerWidth-tip.offsetWidth-12,Math.max(12,x+15))+'px';tip.style.top=Math.min(window.innerHeight-tip.offsetHeight-12,Math.max(12,y+12))+'px';}
function hideTip(){pinned=false;$('#tip').style.display='none';}
function showDetails(key){const rows=filtered().filter(r=>r[state.table]===key);$('#dialogTitle').textContent=nameFor(key,state.table)+' · 用量构成';$('#dialogBody').innerHTML=`<div class="muted small">${rangeStart()} — 2026-09-23 · 示例数据</div>${summary(rows)}<h3>按${state.table==='model'?'用途':'模型'}汇总</h3>${groups(rows,state.table==='model'?'purpose':'model').map(g=>`<div class="detail-list"><span>${nameFor(g.key,state.table==='model'?'purpose':'model')}</span><span>${fmt(g.total)} Token <span class="muted">/ ${g.requests} 次</span></span></div>`).join('')}<p class="small muted" style="margin-top:20px">同一模型请求仅计一次，包含聊天、标题和压缩。此处为原型示例。</p>`;$('#detailDialog').showModal();}
function exportTable(){const rows=currentTable(),labels=['名称','模型ID','Provider','请求次数','输入Token','输出Token','总Token'];const csv='\ufeff'+[labels,...rows.map(r=>[nameFor(r.key,state.table),state.table==='model'?r.key:'',state.table==='model'?MODELS.find(m=>m.id===r.key).provider:'',r.requests,r.input,r.output,r.total])].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='DeepAgent-用量示例-'+state.table+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前明细（示例数据）');}
let toastTimer;function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',2500);}
all('[data-layout]').forEach(b=>b.onclick=()=>{state.layout=b.dataset.layout;state.selection=null;render();});all('[data-days]').forEach(b=>b.onclick=()=>{state.days=Number(b.dataset.days);state.selection=null;render();});[['#userFilter','user'],['#agentFilter','agent'],['#modelFilter','model']].forEach(([selector,k])=>$(selector).onchange=e=>{state[k]=e.target.value;state.selection=null;render();});$('#resetButton').onclick=()=>{Object.assign(state,{days:7,user:'all',agent:'all',model:'all',query:'',selection:null,metric:'total',group:'agent',requests:true,chart:'bar',table:'user',sort:'total',descending:true});state.hidden.clear();['#userFilter','#agentFilter','#modelFilter'].forEach(s=>$(s).value='all');render();};$('#closeDialog').onclick=()=>$('#detailDialog').close();$('#detailDialog').onclick=e=>{if(e.target===$('#detailDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}};$('#helpButton').onclick=()=>{$('#dialogTitle').textContent='三种布局，同一套示例数据';$('#dialogBody').innerHTML='<p><b>A · 均衡总览</b>：主趋势图在上，用途分布与明细在下。</p><p><b>B · 趋势与明细</b>：趋势与分布并排，明细表完整展开。</p><p><b>C · 明细工作台</b>：先选用户或模型，右侧联动日期趋势。</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><p>可操作：用户 / Agent / 模型筛选，7天 / 30天切换，指标与分组选择，图例开关，图表悬浮与固定，表格排序 / 搜索 / 导出。</p><p>柱形或折线使用左轴 Token；虚线始终使用右轴请求次数。关闭图例只改变图表显示，不改变总量和明细。</p><p class="muted small">独立单文件，无网络依赖。所有数据为固定生成的示例，不会读取或修改真实会话。</p>';$('#detailDialog').showModal();};document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip();});window.addEventListener('scroll',hideTip,{passive:true});let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(renderChart,80);});render();
</script>
