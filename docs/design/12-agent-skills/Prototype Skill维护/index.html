<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill 维护 · DeepAgent 交互原型</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/themes.css"><link rel="stylesheet" href="/assets/console.css"><link rel="stylesheet" href="/assets/ui-primitives.css"><link rel="stylesheet" href="prototype.css"><script src="/assets/lucide.min.js" defer></script><script src="/assets/marked.min.js" defer></script><script src="/assets/purify.min.js" defer></script><script src="prototype.js" defer></script></head>
<body><div class="app-shell"><aside class="app-nav"><div class="brand"><img src="/assets/favicon.svg" alt=""><div><strong>DeepAgent</strong><small><span class="status-dot"></span>交互原型</small></div></div><nav id="mainNav" aria-label="控制台主导航"></nav><div class="nav-bottom"><button class="nav-button" id="resetDemo"><i data-lucide="rotate-ccw"></i>重置示例</button><button class="nav-button" id="themeToggle"><i data-lucide="sun-moon"></i>切换主题</button><div class="user-line"><i data-lucide="circle-user-round"></i>本地用户</div></div></aside>
<main id="configurationHost"><header class="page-head"><div><h1>Skill</h1><p>按 Agent 整理任务方法，跨 Agent 复用同一份 Skill。</p></div><div class="head-actions"><span class="prototype-label">示例数据 · 不修改真实配置</span><button class="btn" id="exportBtn"><i data-lucide="download"></i>导出示例</button><button class="btn primary" id="installBtn"><i data-lucide="package-plus"></i>上传安装</button></div></header>
<div class="view-toolbar"><div class="console-segmented" role="group" aria-label="Skill 分组方式"><button data-view="agents" aria-pressed="true"><i data-lucide="bot"></i>按 Agent</button><button data-view="categories" aria-pressed="false"><i data-lucide="folder"></i>按用途</button><button data-view="shared" aria-pressed="false"><i data-lucide="share-2"></i>共享 Skill</button><button data-view="all" aria-pressed="false"><i data-lucide="layout-list"></i>全部 Skill</button></div><div class="toolbar-end"><label class="console-search"><i data-lucide="search"></i><input id="search" type="search" aria-label="搜索 Skill 或 Agent" placeholder="搜索 Skill、编码或 Agent"></label><button class="btn ghost" id="clearSearch" hidden>清空</button></div></div>
<div class="workspace"><aside class="group-pane" aria-label="Skill 分组"><div class="group-pane-head"><span id="groupHeading">Agent</span><span id="groupCount"></span></div><div id="groups"></div><div class="group-note"><i data-lucide="link-2"></i><span>分组展示引用关系<br>不会复制 Skill</span></div></aside><section class="list-pane"><header class="collection-head"><div><div class="collection-title"><span class="collection-icon"><i id="collectionIcon" data-lucide="bot"></i></span><h2 id="collectionTitle"></h2><span id="collectionCount" class="count-pill"></span></div><p id="collectionDescription"></p></div><button class="btn" id="associateBtn"><i data-lucide="link"></i>关联已有</button></header><div class="list-summary"><span id="listSummary"></span><span>点击 Skill 查看说明、资源及引用</span></div><div class="table-wrap console-list-a"><table class="data-table"><thead><tr><th>Skill</th><th>引用 Agent</th><th>资源</th><th>更新时间</th><th><span class="sr-only">操作</span></th></tr></thead><tbody id="skillRows"></tbody></table><div id="emptyState" class="empty" hidden><i data-lucide="search-x"></i><strong>没有匹配的 Skill</strong><p>试试其他名称、编码或分组。</p></div></div><footer class="list-footer"><span id="totalNote"></span><span>同一 Skill 的内容与版本统一维护</span></footer></section></div></main></div>
<div id="drawerShade" hidden></div><aside id="drawer" class="detail-drawer" role="dialog" aria-modal="true" aria-label="Skill 详情" hidden></aside>
<dialog id="actionDialog"><form id="actionForm"><header class="dialog-head"><h2 id="dialogTitle"></h2><button type="button" class="btn ghost compact icon-only" data-close-dialog aria-label="关闭弹窗"><i data-lucide="x"></i></button></header><div id="dialogBody" class="dialog-body"></div><footer class="dialog-foot"><span id="dialogNote"></span><div><button type="button" class="btn" data-close-dialog>取消</button><button type="submit" class="btn primary" id="dialogSave">保存</button></div></footer></form></dialog><div id="toast" role="status" hidden></div></body></html>
