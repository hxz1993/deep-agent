<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function () {
      var path = location.pathname;
      if (!path.endsWith("/")) path += "/";
      var base = document.createElement("base");
      base.href = path;
      document.head.appendChild(base);
      window.__DEEP_AGENT_BASE__ = path;
      window.__DEEP_AGENT_APP_ROOT__ = path.replace(/console\/$/, "");
      document.documentElement.setAttribute("data-theme", localStorage.getItem("da_theme") || "paper");
    })();
  </script>
  <title>DeepAgent 一体化控制台</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=20260728-1" />
  <link id="hljsTheme" rel="stylesheet" href="/vendor/highlight-github-dark.min.css" />
  <link rel="stylesheet" href="./themes.css?v=20260821-2" />
  <link rel="stylesheet" href="./workspace.css?v=20260904-13" />
  <link rel="stylesheet" href="./configuration/configuration.css?v=20260909-7" />
  <link rel="stylesheet" href="./console.css?v=20260909-5" />
  <link rel="stylesheet" href="./diagnostics.css?v=20260909-1" />
</head>
<body data-console-page="workspace">
  <div class="console-shell">
    <aside class="console-rail" aria-label="控制台主导航">
      <header class="console-rail-header">
        <div class="console-brand">
          <button type="button" class="console-brand-icon" id="expandConsoleNavBtn" aria-label="DeepAgent" title="DeepAgent"><img src="./favicon.svg?v=20260728-1" alt="" /></button>
          <div class="console-brand-copy"><strong>DeepAgent</strong><span class="connection-pill" id="connStatus" title="后端服务连接状态"><span class="dot"></span><span class="conn-text">连接中</span></span></div>
        </div>
        <button type="button" class="console-rail-toggle" id="toggleConsoleNavBtn" aria-label="收起导航" title="收起导航" aria-expanded="true" aria-controls="consoleResourceNav"><i data-lucide="panel-left-close" aria-hidden="true"></i></button>
      </header>
      <nav class="console-nav">
        <button type="button" class="console-nav-btn active" data-page="workspace" title="对话测试" aria-label="对话测试">
          <i data-lucide="message-square-code"></i><span>对话测试</span>
        </button>
      </nav>
      <nav class="resource-nav" aria-label="配置目录" id="consoleResourceNav"></nav>
      <div class="console-nav-footer">
        <button type="button" class="console-nav-btn" data-page="diagnostics" title="诊断中心" aria-label="诊断中心">
          <i data-lucide="activity"></i><span>诊断中心</span>
        </button>
      <a class="console-rail-link" href="../docs" target="_blank" rel="noopener noreferrer" title="接口文档" aria-label="接口文档">
        <i data-lucide="book-open-text"></i><span>接口文档</span>
      </a>
      </div>
      <div class="console-rail-settings">
        <div class="console-theme-control">
          <button type="button" id="consoleThemeBtn" aria-label="切换主题" title="切换主题" aria-expanded="false" aria-controls="consoleThemeMenu"><i data-lucide="sun"></i></button>
        <div class="theme-switch" id="consoleThemeMenu" aria-label="界面主题">
          <button type="button" data-console-theme="light" title="明亮"><i data-lucide="sun"></i></button>
          <button type="button" data-console-theme="paper" title="护眼"><i data-lucide="leaf"></i></button>
          <button type="button" data-console-theme="dark" title="暗色"><i data-lucide="moon"></i></button>
          <button type="button" data-console-theme="contrast" title="高对比"><i data-lucide="contrast"></i></button>
        </div>
        </div>
        <button type="button" class="user-pill" id="currentUserBtn" aria-label="当前平台用户" aria-expanded="false">
          <i data-lucide="circle-user-round"></i>
          <span class="console-user-name" id="consoleUserName">当前用户</span>
          <span class="user-popover user-account-popover" role="tooltip">
            <span class="user-popover-heading">
              <span class="user-popover-icon"><i data-lucide="circle-user-round" aria-hidden="true"></i></span>
              <span><small>用户名</small><strong id="currentUserFull">识别中</strong></span>
            </span>
            <span class="user-popover-runtime">
              <span><small>产品版本</small><strong class="product-version" id="productVersion" title="正在读取 DeepAgent 产品版本">v—</strong></span>
              <span><small>数据库结构</small><strong class="runtime-schema-version" id="databaseSchemaVersion">—</strong></span>
            </span>
          </span>
        </button>
      </div>
      <div id="consoleNavResizer" class="console-nav-resizer" role="separator" tabindex="0" aria-label="调整导航宽度" aria-orientation="vertical" aria-valuemin="56" aria-valuemax="200" aria-valuenow="200"></div>
    </aside>

    <div class="console-banner hidden" id="consoleBanner" role="alert"></div>

    <main class="console-main">
      <section class="console-page active" id="page-workspace" data-page-panel="workspace">
        <div class="workspace-loading" id="workspaceLoading">
          <span class="loading-spinner"></span><span>正在加载测试工作台…</span>
        </div>
        <div class="workspace-grid hidden" id="workspaceGrid">
          <div class="workspace-legacy-host" id="workspaceLegacyHost"></div>
          <div class="workspace-resizer workspace-resizer-inspector" id="inspectorPaneResizer" role="separator" tabindex="0" aria-label="调整会话详情宽度" aria-orientation="vertical" aria-valuemin="260" aria-valuemax="720" aria-valuenow="320" data-resize-pane="inspector"></div>
          <aside class="inspector-pane" id="inspectorPane">
            <div class="inspector-content" id="inspectorContent">
              <div class="inspector-empty"><i data-lucide="scan-search"></i><p>选择会话后查看会话与上下文信息</p></div>
            </div>
          </aside>
        </div>
      </section>

      <section class="console-page" id="page-configuration" data-page-panel="configuration">
        <div class="configuration-shell">
          <template id="configurationNavigation">
            <button class="tab resource-btn active" data-tab="agents"><i data-lucide="bot"></i><span>Agent</span></button>
            <div class="resource-group-label">设置</div>
            <button class="tab resource-btn" data-tab="llm-providers"><i data-lucide="waypoints"></i><span>Provider</span></button>
            <button class="tab resource-btn" data-tab="skills"><i data-lucide="book-open-check"></i><span>Skill</span></button>
            <button class="tab resource-btn" data-tab="mcp">
              <svg class="mcp-brand-icon" viewBox="0 0 180 180" fill="none" aria-hidden="true">
                <path d="M23.5996 85.2532L86.2021 22.6507C94.8457 14.0071 108.86 14.0071 117.503 22.6507C126.147 31.2942 126.147 45.3083 117.503 53.9519L70.2254 101.23" />
                <path d="M70.8789 100.578L117.504 53.952C126.148 45.3083 140.163 45.3083 148.806 53.952L149.132 54.278C157.776 62.9216 157.776 76.9357 149.132 85.5792L92.5139 142.198C89.6327 145.079 89.6327 149.75 92.5139 152.631L104.14 164.257" />
                <path d="M101.853 38.3013L55.553 84.6011C46.9094 93.2447 46.9094 107.258 55.553 115.902C64.1966 124.546 78.2106 124.546 86.8543 115.902L133.154 69.6025" />
              </svg>
              <span>MCP</span>
            </button>
            <button class="tab resource-btn" data-tab="builtin-tools"><i data-lucide="blocks"></i><span>内置工具</span></button>
            <button class="tab resource-btn" data-tab="ui-tools"><i data-lucide="panel-top"></i><span>UI 工具</span></button>
            <button class="tab resource-btn" data-tab="channels"><i data-lucide="radio-tower"></i><span>渠道</span></button>
            <div class="resource-group-label separated">系统</div>
            <button class="tab resource-btn" data-tab="global-settings"><i data-lucide="settings-2"></i><span>全局配置</span></button>
            <button class="tab resource-btn" data-tab="catalog"><i data-lucide="library"></i><span>模型目录</span></button>
          </template>
          <section class="configuration-content">
            <div class="configuration-loading" id="configurationLoading">
              <span class="loading-spinner"></span><span>正在加载配置中心…</span>
            </div>
            <div id="configurationHost"></div>
          </section>
        </div>
      </section>

      <section class="console-page" id="page-diagnostics" data-page-panel="diagnostics">
        <div class="diagnostics-page">
          <header class="diagnostics-head">
            <div><h1>诊断中心</h1><p id="diagnosticsInstance">当前部署实例 · API / 企微网关</p></div>
            <button type="button" class="diagnostics-button" id="diagnosticsRefresh"><i data-lucide="refresh-cw" aria-hidden="true"></i><span>刷新</span></button>
          </header>
          <form class="diagnostics-filters" id="diagnosticsFilters" autocomplete="off">
            <div class="diagnostics-filter-row">
              <div class="diagnostics-field"><span id="diagnosticsPeriodLabel">时间范围</span><div class="console-select" data-diagnostic-select="period"><button type="button" class="console-select-trigger" aria-labelledby="diagnosticsPeriodLabel diagnosticsPeriodValue" aria-haspopup="listbox" aria-expanded="false" aria-controls="diagnosticsPeriodMenu"><span id="diagnosticsPeriodValue">最近 24 小时</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><div class="console-select-menu hidden" role="listbox" aria-labelledby="diagnosticsPeriodLabel" id="diagnosticsPeriodMenu"></div></div></div>
              <div class="diagnostics-field"><span id="diagnosticsSourceLabel">来源</span><div class="console-select" data-diagnostic-select="source"><button type="button" class="console-select-trigger" aria-labelledby="diagnosticsSourceLabel diagnosticsSourceValue" aria-haspopup="listbox" aria-expanded="false" aria-controls="diagnosticsSourceMenu"><span id="diagnosticsSourceValue">全部来源</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><div class="console-select-menu hidden" role="listbox" aria-labelledby="diagnosticsSourceLabel" id="diagnosticsSourceMenu"></div></div></div>
              <div class="diagnostics-field"><span id="diagnosticsLevelLabel">等级</span><div class="console-select" data-diagnostic-select="level"><button type="button" class="console-select-trigger" aria-labelledby="diagnosticsLevelLabel diagnosticsLevelValue" aria-haspopup="listbox" aria-expanded="false" aria-controls="diagnosticsLevelMenu"><span id="diagnosticsLevelValue">全部等级</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><div class="console-select-menu hidden" role="listbox" aria-labelledby="diagnosticsLevelLabel" id="diagnosticsLevelMenu"></div></div></div>
              <label class="diagnostics-field diagnostics-keyword"><span>关键词</span><input type="search" id="diagnosticsKeyword" placeholder="搜索摘要、事件或标识" maxlength="200" /></label>
            </div>
            <div class="diagnostics-custom-time hidden" id="diagnosticsCustomTime"><label class="diagnostics-field"><span>开始时间（本地时区）</span><input type="datetime-local" id="diagnosticsStart" /></label><label class="diagnostics-field"><span>结束时间（本地时区）</span><input type="datetime-local" id="diagnosticsEnd" /></label></div>
            <div class="diagnostics-filter-row diagnostics-identifiers">
              <label class="diagnostics-field"><span>Session ID</span><input type="text" id="diagnosticsSession" placeholder="全部会话（跨用户）" maxlength="128" spellcheck="false" /></label>
              <label class="diagnostics-field"><span>Run ID</span><input type="text" id="diagnosticsRun" placeholder="全部执行" maxlength="128" spellcheck="false" /></label>
              <div class="diagnostics-filter-actions"><button type="submit" class="diagnostics-button primary" id="diagnosticsQuery"><i data-lucide="search" aria-hidden="true"></i><span>查询</span></button><button type="button" class="diagnostics-button" id="diagnosticsReset">清空条件</button></div>
            </div>
          </form>
          <div class="diagnostics-notice hidden" id="diagnosticsNotice" role="status" aria-live="polite"></div>
          <div class="diagnostics-result-head"><span id="diagnosticsMeta" aria-live="polite">尚未查询</span><span id="diagnosticsCopyStatus" role="status" aria-live="polite"></span></div>
          <div class="diagnostics-log-view" tabindex="0" aria-label="诊断日志列表">
            <div class="diagnostics-columns" aria-hidden="true"><span></span><span>时间</span><span>等级</span><span>来源</span><span>摘要 / 事件</span><span>耗时</span></div>
            <div id="diagnosticsRecords"></div>
            <div class="diagnostics-empty" id="diagnosticsEmpty">正在准备日志查询…</div>
          </div>
          <footer class="diagnostics-footer"><span id="diagnosticsPartial" class="hidden"></span><button type="button" class="diagnostics-button hidden" id="diagnosticsMore">加载更多</button></footer>
        </div>
      </section>
    </main>
  </div>

  <div class="auth-lock hidden" id="authLock">
    <div class="auth-lock-content"><i data-lucide="shield-alert" data-access-lock-icon></i><h2 id="authLockTitle">正在检查控制台权限</h2><p id="authLockMessage">请稍候…</p><button type="button" id="retryIdentityBtn">重新检查</button></div>
  </div>

  <aside class="context-popover hidden" id="contextPopover" aria-hidden="true" role="dialog" aria-label="测试 App" inert>
    <header><div><strong>测试 App</strong><span>仅影响当前控制台请求</span></div><button type="button" id="closeContextBtn" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></header>
    <label class="context-app-field"><span>应用编码 App</span><input id="contextAppInput" autocomplete="off" placeholder="例如 mdxath003" /></label>
    <p class="context-popover-hint">Space 根据 App 自动推导，语言固定为简体中文。</p>
    <dl class="context-effective-values" id="effectiveContext"></dl>
    <footer><button type="button" id="resetContextBtn">不分应用</button><button type="button" class="primary" id="saveContextBtn">确定</button></footer>
  </aside>

  <div class="console-toast hidden" id="consoleToast"></div>
  <div class="hidden" id="consoleRuntimeControls">
    <select id="agentSelect"></select>
    <select id="themeSelect"></select>
    <a id="settingsLink"></a><a id="modelsLink"></a><a id="adminLink"></a>
  </div>

  <script src="../vendor/lucide.min.js"></script>
  <script src="./api.js?v=20260902-1"></script>
  <script src="./theme.js?v=20260720-1"></script>
  <script src="../vendor/marked.min.js"></script>
  <script src="../vendor/purify.min.js"></script>
  <script src="../vendor/highlight.min.js"></script>
  <script src="./json-view.js?v=20260823-1"></script>
  <script src="./markdown.js?v=20260822-2"></script>
  <script type="module" src="./main.js?v=20260909-8"></script>
</body>
</html>
